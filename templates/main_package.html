<style>
  tr.primary {
      font-weight: bold;
  }
</style>
<table width=100%>
      <tr>
<th class="header clickable" onclick="toggleVisHeader(this)" id="package_header"><span class="arrow">▼</span>Package</th>
  </tr>
</table>
<table width=100% id="package" class="hidable">
    <colgroup>
        <col style="width:15%;">
        <col style="width:10%;">
        <col style="width:15%;">
        <col style="width:15%;">
        <col style="width:15%;">
        <col style="width:15%;">
        <col style="width:15%;">
    </colgroup>
    <thead>
        <tr>
            <th>Callsign</th>
            <th>Flight #</th>
            <th>Role</th>
            <th>Aircraft</th>
            <th>Takeoff</th>
            <th>Push</th>
            <th>TOT</th>
        </tr>
    </thead>
    <tbody>
      {% for flight in package %}
      <tr {% if flight.roster.own %} class="primary" {% endif %}>
	<td>{{flight.callsign}}</td>
	<td>{{flight.flight}}</td>
	<td>{{flight.role}}</td>
	<td>{{flight.aircraft}}</td>
	<td>{{flight.takeoff}}</td>
	<td>{{flight.push}}</td>
	<td>{{flight.tot}}</td>
      </tr>
      {% endfor %}
    </tbody>
</table>
