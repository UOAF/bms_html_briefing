<!DOCTYPE = html>
<head>
<meta charset="utf-8">
<title>HTML BRIEFING {%- if not brief_is_joined %}- PAGE {{num}}{% endif %}</title>
<link rel="shortcut icon" type="image/png" href="assets/icon.png">
<link rel="stylesheet" href="templates/style_preview.css" media="screen">
<link rel="stylesheet" href="templates/style_print.css" media="print">
<link rel="stylesheet" href="dist/leaflet/leaflet.css" />
<script src="dist/leaflet/leaflet.js"></script>
<style>
  .page {
      width: 100%;
  }
table {
  width: 100%;
  table-layout: fixed;
}

table, th, td {
  text-align: center;
  align-items: center; 
  vertical-align : middle;
  padding: var(--brief-cell-padding, 3px);
}
.editable {
  background-color: #ffffff;
}
.briefing-flow-field {
  text-align: left;
  vertical-align: top;
}
td {
    height: var(--brief-row-height, 1.7em);
}
.header {
    background-color: #dddddd;
}
.refreshButton {
    font-weight: bold;
}
.nowrap {
    white-space: nowrap;
    word-break: normal;
}
@media print {
    .page, .page-break { break-after: page; }
}
  .imageFileInput {
padding: 0;
margin: 0;
width: 100%;
  }

  .arrow {
      float: left;
  }
  .clickable{
      cursor: pointer;
  }
</style>

<link rel="stylesheet" href="templates/dtc_fields.css" media="screen">
<script src="templates/dtc_fields.js"></script>
<script src="templates/popup_briefing.js"></script>
<script>const dtcFieldPayload = {{ dtc_fields|tojson }};</script>
<script src="templates/main_script.js"></script>

</head>
<body{% if not brief_is_joined and brief_page_styles is defined %} style="{{ brief_page_styles[num - 1] }}"{% endif %}>
{% if brief_is_joined %}
{% for page in brief_pages %}
<div {% if loop.index != brief_pages|length %} class="page" {% endif %} id="page_{{loop.index}}"{% if brief_page_styles is defined %} style="{{ brief_page_styles[loop.index0] }}"{% endif %}>
  {% for part in page %}
   {% include (part+".html") %}
  {% endfor %}
<table width="100%">
    <thead>
      <tr>
	<th class="header" width="10%"> Page {{loop.index}}</th>
        </tr>
    </thead>
</table>
</div>
<br>
{% endfor %}

{% else %}
{% for p in brief_pages[num - 1] %}
   {% include (p+".html") %}
{% endfor %}
<table width="100%">
    <thead>
      <tr>
	<th class="header" width="10%"> Page {{num}}</th>
        </tr>
    </thead>
</table>
{% endif %}
<style>
</style>
</body>
