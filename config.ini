# Put the location of your BMS install here, e.g. "D:\Falcon BMS 4.38"
bms_location = D:\Falcon BMS 4.38

# Specify the location where the .html files will be put. Must exist.
output_folder = C:\Games\bms_html_briefing\output

# Specify your BMS callsign.
callsign = Wsy

# This is a list of pages, you can add/delete new ones and reorder the content. Possible content values are: 
# airbase, package, flightplan, roster, admin, weapon_settings, cmds, targets, delivery, aa_brevity_notes, support,
# weapons, tgtsteerpoints, roe, weather
page = airbase, package, flightplan
page = roster, admin, weapon_settings, cmds, targets, delivery, aa_brevity_notes, support
page = weapons, tgtsteerpoints, roe, weather

# If this value is set to False, each page is rendered to a separate HTML. If it is set to True, all pages are rendered into a single HTML. 
# A modern browser's Print to PDF function should separate the pages correctly.
joined = True
