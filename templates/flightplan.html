<style>
</style>
<table width=100%>
      <tr>
	  <th class="header clickable" onclick="toggleVisHeader(this)" id="flightplan_header"><span class="arrow">▼</span>Flightplan</th>
      </tr>
</table>
<table width=100% id="flightplan" class="hidable">
    <colgroup>
        <col style="width:3%;">
        <col style="width:13%;">
        <col style="width:8%;">
        <col style="width:6%;">
        <col style="width:6%;">
        <col style="width:5%;">
        <col style="width:9%;">
        <col style="width:16%;">
        <col style="width:11%;">
        <col style="width:23%;">
    </colgroup>
    <tr>
            <th>#</th>
            <th>Descr.</th>
            <th class="nowrap">Time</th>
            <th>Dist.</th>
            <th>HDG</th>
            <th>CAS</th>
            <th>Alt.</th>
            <th>Action</th>
            <th>Form.</th>
	    <th>Comment</th>
        </tr>
    </thead>
    <tbody>
      {% for stpt in steerpoints %}
      <tr>
	<td>{{stpt.number}}</td>
	<td>{{stpt.description}}</td>
	<td class="nowrap">{{stpt.time}}</td>
	<td>{{stpt.distance}}</td>
	<td>{{stpt.heading}}</td>
	<td>{{stpt.cas}}</td>
	<td>{{stpt.altitude}}</td>
	<td>{{stpt.action}}</td>
	<td>{{stpt.form}}</td>
	<td>{{stpt.comment}}</td>
      </tr>
      {% endfor %}
    </tbody>
</table>
