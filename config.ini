[system]
output_dir = output
pdf_output_dir = kneeboards
wine_prefix = 
auto_export_on_change = False
auto_export_pdf_only = False
debug_log = False
map = esri_imagery_hybrid
briefing_scroll_mode = continuous


[bms]
bms_version = 4.38
bms_available_versions = 4.37, 4.38
default_airframe = F-16

[pages]
charts =
page1 = package, weather
page2 = roster, admin, weapons, weapon_settings, wpn_targets, cmds, custom_checklist
page3 = flightplan
page4 = targets, tgtsteerpoints, wpn_targets, delivery, aa_brevity_notes, roe, support
page5 = map
page6 = airbase, comms

# Optional text sizing for both preview and PDF. Omit this section to keep defaults.
# font_size is in CSS pixels (6–32); spacing is normal or compact.
# Page overrides use the matching key from [pages]. Restart after editing.
[briefing_style]
font_size = 16
spacing = normal
# page1_font_size = 11
# page1_spacing = compact
