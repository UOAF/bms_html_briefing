<script>
var map = L.map('image-map', {
	minZoom: -3,
	maxZoom: 5,
	zoom: -2,
	crs: L.CRS.Simple,
	zoomControl: false,
	doubleClickZoom: false,
    });

var imageWidth = 4096,
    imageHeight = 4096;

var southWest = map.unproject([0, imageHeight], 0);
var northEast = map.unproject([imageWidth, 0], 0);
    
var bounds = new L.LatLngBounds(southWest, northEast);

map.setMaxBounds([southWest, northEast]);

let mapBaseDataUrl = null;
map_overlay = L.imageOverlay("", bounds, { crossOrigin: true }).addTo(map);
bullseye_overlay = L.imageOverlay("assets/bullseye.png", bounds).addTo(map);

function setBullseye(latlng) {
    bullseye_overlay.setBounds([[southWest.lat + latlng.lat + imageWidth/2, southWest.lng + latlng.lng - imageHeight/2], [northEast.lat + latlng.lat + imageWidth/2, northEast.lng + latlng.lng - imageHeight/2]]);
  }
 
drawings = L.layerGroup();

// dimensions of the Falcon map
var fWidth = 3359580,
    fHeight = 3359580;

const MAP_STYLE = {
    flightPath: {
        color: "white",
        weight: 3,
        lineJoin: "round",
        haloColor: "rgba(0,0,0,0.55)",
        haloWeight: 5
    },
    flightMarker: {
        color: "white",
        fillOpacity: 1,
        radius: 8,
        canvasFillStyle: "#ffffff",
        canvasStrokeStyle: "#000000"
    },
    startMarker: {
        radius: 4,
        color: "#000000",
        fillColor: "#ffffff",
        fillOpacity: 1,
        weight: 1.5
    },
    endMarker: {
        radius: 10,
        color: "#a9c7e6",
        fillColor: "rgba(0,0,0,0)",
        fillOpacity: 0,
        weight: 2.2
    },
    penultimateMarker: {
        radius: 11,
        color: "#a9c7e6",
        fillColor: "rgba(0,0,0,0)",
        fillOpacity: 0,
        weight: 2,
        dashArray: "4 3",
        dashPattern: [4, 3]
    },
    steerpointLine: { color: "black", weight: 2, dashArray: "6 4", dashPattern: [6, 4] },
    threatCircle: {
        color: "red",
        fillColor: "red",
        fillOpacity: 0.06,
        opacity: 0.5,
        canvasFillStyle: "rgba(255,0,0,0.08)",
        weight: 2,
        dashArray: "8 5",
        dashPattern: [8, 5]
    },
    threatCenter: {
        radius: 3,
        color: "#ffffff",
        strokeColor: "#000000",
        strokeWidth: 1
    },
    anchorCenter: {
        radius: 3,
        color: "#a9c7e6",
        strokeColor: "#000000",
        strokeWidth: 1
    },
    flightPointText: {
        color: "#000000",
        font: '700 10px "Map Overlay Mono"',
        offsetX: 0,
        offsetY: 0,
        textAlign: "center",
        textBaseline: "middle"
    },
    anchorText: {
        fillStyle: "#a9c7e6",
        strokeStyle: "rgba(0,0,0,0.92)",
        lineWidth: 1.2,
        font: '700 11px "Map Overlay Mono"',
        offsetX: 10,
        offsetY: -10
    },
    threatText: {
        fillStyle: "#ffffff",
        strokeStyle: "rgba(0,0,0,0.72)",
        lineWidth: 1.25,
        font: '700 12px "Map Overlay Mono"',
        textAlign: "center",
        textBaseline: "middle",
        offsetX: 0,
        offsetY: 10
    }
};

const MAP_EXPORT_SCALE = 2;

const LEAFLET_TOOLTIP_OPTS = {
    flightPoint: { direction: "center", permanent: true, opacity: 0.9, className: "leaflet-tooltip-fp" },
    threat: { direction: "bottom", permanent: true, opacity: 1, className: "leaflet-tooltip-threat" },
    alt: { direction: "bottom", permanent: true, opacity: 1, className: "leaflet-tooltip-anchor" }
};

function convertScalar(iniScalar) {
    const num = parseFloat(iniScalar);
    if (!Number.isFinite(num)) return 0;
    return num/fHeight*imageHeight;
}

function convertCoord(iniCoord) {
    if (!iniCoord || iniCoord.length < 2) return [0,0];
    const x = parseFloat(iniCoord[0]);
    const y = parseFloat(iniCoord[1]);
    if (!Number.isFinite(x) || !Number.isFinite(y)) return [0,0];
    return [convertScalar(x) - imageHeight, convertScalar(y)];
}

window.exportMapLastError = null;
window.exportMapLog = [];


  let stptIniCoords = [{% for point in stpt_coords %}
		       [ {{point.coord_x}}, {{point.coord_y}}],
		       {% endfor %}]

    stptMapCoords = [];

let tstptIniCoords = [{% for point in tstpt_coords %}
		      [ [{{point.coord_x}}, {{point.coord_y}}], "{{point.radius}}", "{{point.name}}" ],
		       {% endfor %}]
tstptMapCoords = [];

let stptLineIniCoords = [{% for line in stpt_lines %}
			 [{% for point in line %}
		       [{{point.coord_x}}, {{point.coord_y}}],
			  {% endfor %}],
		       {% endfor %}]

stptLineMapCoords = [[],[],[],[]];

function validLatLng(latlng) {
    return Array.isArray(latlng) && latlng.length >= 2 && Number.isFinite(latlng[0]) && Number.isFinite(latlng[1]);
}

function rebuildMapCoords() {
    stptMapCoords = stptIniCoords.map(convertCoord);
    tstptMapCoords = tstptIniCoords.map((entry) => {
        const radiusVal = parseFloat(entry[1]);
        return [
            convertCoord(entry[0]),
            Number.isFinite(radiusVal) ? convertScalar(radiusVal) : 0,
            entry[2] || ""
        ];
    });
    stptLineMapCoords = stptLineIniCoords.map((line) => line.map(convertCoord));
}

function getFlightRouteCoords() {
    return stptMapCoords.slice(0, -1).filter(validLatLng);
}

function getFlightPointEntries() {
    return stptMapCoords
        .map((latlng, index) => ({ latlng, index }))
        .filter((entry) => entry.index > 0 && entry.index < stptMapCoords.length - 1 && validLatLng(entry.latlng));
}

function getEndpointEntries() {
    const entries = [];
    const startLatLng = stptMapCoords[0];
    const endLatLng = stptMapCoords[stptMapCoords.length - 1];
    if (validLatLng(startLatLng)) {
        entries.push({ kind: "start", latlng: startLatLng });
    }
    if (validLatLng(endLatLng)) {
        entries.push({ kind: "end", latlng: endLatLng });
    }
    return entries;
}

function getPenultimateEntry() {
    if (stptMapCoords.length < 2) return null;
    const latlng = stptMapCoords[stptMapCoords.length - 2];
    if (!validLatLng(latlng)) return null;
    return { latlng, index: stptMapCoords.length - 2 };
}

function getAnchorLabels() {
    const labels = [];
    const altLatLng = stptMapCoords[stptMapCoords.length - 1];
    if (validLatLng(altLatLng)) {
        labels.push({ text: "ALT", latlng: altLatLng, tooltipOptions: LEAFLET_TOOLTIP_OPTS.alt });
    }
    return labels;
}

function getThreatEntries() {
    return tstptMapCoords
        .map((entry) => ({
            latlng: entry && entry[0],
            radius: entry && Number.isFinite(entry[1]) ? entry[1] : 0,
            label: entry && entry.length > 2 ? entry[2] : ""
        }))
        .filter((entry) => validLatLng(entry.latlng));
}

function getSteerpointLines() {
    return stptLineMapCoords
        .map((line) => line.filter(validLatLng))
        .filter((line) => line.length > 0);
}

function addTooltipMarker(latlng, html, tooltipOptions) {
    return L.marker(latlng, { icon: L.divIcon({ iconSize: 0 }) })
        .setOpacity(0)
        .addTo(drawings)
        .bindTooltip(html, tooltipOptions)
        .openTooltip();
}

function renderFlightPlanLeaflet() {
    const routeCoords = getFlightRouteCoords();
    getEndpointEntries().forEach((entry) => {
        const style = entry.kind === "start" ? MAP_STYLE.startMarker : MAP_STYLE.endMarker;
        L.circleMarker(entry.latlng, {
            radius: style.radius,
            color: style.color,
            weight: style.weight,
            fillColor: style.fillColor,
            fillOpacity: style.fillOpacity
        }).addTo(drawings);
    });
    const penultimateEntry = getPenultimateEntry();
    if (penultimateEntry) {
        L.circleMarker(penultimateEntry.latlng, {
            radius: MAP_STYLE.penultimateMarker.radius,
            color: MAP_STYLE.penultimateMarker.color,
            weight: MAP_STYLE.penultimateMarker.weight,
            fillColor: MAP_STYLE.penultimateMarker.fillColor,
            fillOpacity: MAP_STYLE.penultimateMarker.fillOpacity,
            dashArray: MAP_STYLE.penultimateMarker.dashArray
        }).addTo(drawings);
    }
    getFlightPointEntries().forEach((entry) => {
        L.circleMarker(entry.latlng, {
            color: MAP_STYLE.flightMarker.color,
            fillOpacity: MAP_STYLE.flightMarker.fillOpacity,
            radius: MAP_STYLE.flightMarker.radius,
            zIndexOffset: -entry.index
        }).addTo(drawings).bindTooltip(
            "<span style='color:#0a0a0a'>" + (entry.index + 1).toString() + "</span>",
            LEAFLET_TOOLTIP_OPTS.flightPoint
        ).openTooltip();
    });
    getAnchorLabels().forEach((entry) => {
        L.circleMarker(entry.latlng, {
            radius: MAP_STYLE.anchorCenter.radius,
            color: MAP_STYLE.anchorCenter.strokeColor,
            weight: MAP_STYLE.anchorCenter.strokeWidth,
            fillColor: MAP_STYLE.anchorCenter.color,
            fillOpacity: 1
        }).addTo(drawings);
        addTooltipMarker(entry.latlng, "<b>" + entry.text + "</b>", entry.tooltipOptions);
    });
    if (routeCoords.length > 0) {
        L.polyline(routeCoords, MAP_STYLE.flightPath).addTo(drawings);
    }
}

function renderThreatsLeaflet() {
    getThreatEntries().forEach((entry) => {
        addTooltipMarker(entry.latlng, "<b>" + entry.label + "</b>", LEAFLET_TOOLTIP_OPTS.threat);
        L.circleMarker(entry.latlng, {
            radius: MAP_STYLE.threatCenter.radius,
            color: MAP_STYLE.threatCenter.strokeColor,
            weight: MAP_STYLE.threatCenter.strokeWidth,
            fillColor: MAP_STYLE.threatCenter.color,
            fillOpacity: 1
        }).addTo(drawings);
        if (entry.radius > 0) {
            L.circle(entry.latlng, {
                radius: entry.radius,
                color: MAP_STYLE.threatCircle.color,
                fillColor: MAP_STYLE.threatCircle.fillColor,
                fillOpacity: MAP_STYLE.threatCircle.fillOpacity,
                opacity: MAP_STYLE.threatCircle.opacity,
                weight: MAP_STYLE.threatCircle.weight,
                dashArray: MAP_STYLE.threatCircle.dashArray
            }).addTo(drawings);
        }
    });
}

function renderSteerpointLinesLeaflet() {
    getSteerpointLines().forEach((line) => {
        L.polyline(line, MAP_STYLE.steerpointLine).addTo(drawings);
    });
}

function getOverlayDrawRect(overlay) {
    const sw = overlay.getBounds().getSouthWest();
    const ne = overlay.getBounds().getNorthEast();
    const topLeft = map.latLngToContainerPoint(ne);
    const bottomRight = map.latLngToContainerPoint(sw);
    return {
        x: topLeft.x,
        y: topLeft.y,
        width: bottomRight.x - topLeft.x,
        height: bottomRight.y - topLeft.y
    };
}

function latLngToCanvasPoint(latlng) {
    return map.latLngToContainerPoint(latlng);
}

function getThreatRadiusPx(centerLatLng, radius) {
    const center = latLngToCanvasPoint(centerLatLng);
    const edge = latLngToCanvasPoint([centerLatLng[0] + radius, centerLatLng[1]]);
    return Math.abs(edge.y - center.y);
}

function drawCanvasPolyline(ctx, latlngs, style) {
    const validPoints = latlngs.filter(validLatLng);
    if (validPoints.length === 0) return;
    ctx.save();
    const drawPath = () => {
        ctx.beginPath();
        validPoints.forEach((latlng, index) => {
            const point = latLngToCanvasPoint(latlng);
            if (index === 0) ctx.moveTo(point.x, point.y);
            else ctx.lineTo(point.x, point.y);
        });
    };
    ctx.lineJoin = style.lineJoin || "miter";
    ctx.setLineDash(Array.isArray(style.dashPattern) ? style.dashPattern : []);
    if (style.haloColor && style.haloWeight) {
        ctx.strokeStyle = style.haloColor;
        ctx.lineWidth = style.haloWeight;
        drawPath();
        ctx.stroke();
    }
    ctx.strokeStyle = style.color;
    ctx.lineWidth = style.weight;
    drawPath();
    ctx.stroke();
    ctx.restore();
}

function drawCanvasCircle(ctx, point, radius, style) {
    ctx.save();
    ctx.setLineDash(Array.isArray(style.dashPattern) ? style.dashPattern : []);
    ctx.beginPath();
    ctx.arc(point.x, point.y, radius, 0, 2 * Math.PI);
    if (style.fillStyle) {
        ctx.fillStyle = style.fillStyle;
        ctx.fill();
    }
    if (style.strokeStyle) {
        ctx.strokeStyle = style.strokeStyle;
        ctx.lineWidth = style.lineWidth || 1;
        ctx.stroke();
    }
    ctx.restore();
}

function drawCanvasText(ctx, text, point, style) {
    ctx.save();
    ctx.font = style.font;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.miterLimit = 1.5;
    if (style.textAlign) ctx.textAlign = style.textAlign;
    if (style.textBaseline) ctx.textBaseline = style.textBaseline;
    const x = point.x + (style.offsetX || 0);
    const y = point.y + (style.offsetY || 0);
    if (style.strokeStyle) {
        ctx.strokeStyle = style.strokeStyle;
        ctx.lineWidth = style.lineWidth || 1;
        ctx.strokeText(text, x, y);
    }
    if (style.fillStyle || style.color) {
        ctx.fillStyle = style.fillStyle || style.color;
        ctx.fillText(text, x, y);
    }
    ctx.restore();
}

function renderFlightPlanCanvas(ctx) {
    drawCanvasPolyline(ctx, getFlightRouteCoords(), MAP_STYLE.flightPath);
    getEndpointEntries().forEach((entry) => {
        const point = latLngToCanvasPoint(entry.latlng);
        const style = entry.kind === "start" ? MAP_STYLE.startMarker : MAP_STYLE.endMarker;
        drawCanvasCircle(ctx, point, style.radius, {
            fillStyle: style.fillOpacity > 0 ? style.fillColor : null,
            strokeStyle: style.color,
            lineWidth: style.weight
        });
    });
    const penultimateEntry = getPenultimateEntry();
    if (penultimateEntry) {
        drawCanvasCircle(ctx, latLngToCanvasPoint(penultimateEntry.latlng), MAP_STYLE.penultimateMarker.radius, {
            fillStyle: MAP_STYLE.penultimateMarker.fillOpacity > 0 ? MAP_STYLE.penultimateMarker.fillColor : null,
            strokeStyle: MAP_STYLE.penultimateMarker.color,
            lineWidth: MAP_STYLE.penultimateMarker.weight,
            dashPattern: MAP_STYLE.penultimateMarker.dashPattern
        });
    }
    getFlightPointEntries().forEach((entry) => {
        const point = latLngToCanvasPoint(entry.latlng);
        drawCanvasCircle(ctx, point, MAP_STYLE.flightMarker.radius, {
            fillStyle: MAP_STYLE.flightMarker.canvasFillStyle,
            strokeStyle: MAP_STYLE.flightMarker.canvasStrokeStyle,
            lineWidth: 1
        });
        drawCanvasText(ctx, String(entry.index + 1), point, MAP_STYLE.flightPointText);
    });
    getAnchorLabels().forEach((entry) => {
        const point = latLngToCanvasPoint(entry.latlng);
        drawCanvasCircle(ctx, point, MAP_STYLE.anchorCenter.radius, {
            fillStyle: MAP_STYLE.anchorCenter.color,
            strokeStyle: MAP_STYLE.anchorCenter.strokeColor,
            lineWidth: MAP_STYLE.anchorCenter.strokeWidth
        });
        drawCanvasText(ctx, entry.text, point, MAP_STYLE.anchorText);
    });
}

function renderThreatsCanvas(ctx) {
    getThreatEntries().forEach((entry) => {
        const center = latLngToCanvasPoint(entry.latlng);
        drawCanvasCircle(ctx, center, MAP_STYLE.threatCenter.radius, {
            fillStyle: MAP_STYLE.threatCenter.color,
            strokeStyle: MAP_STYLE.threatCenter.strokeColor,
            lineWidth: MAP_STYLE.threatCenter.strokeWidth
        });
        if (entry.radius > 0) {
            drawCanvasCircle(ctx, center, getThreatRadiusPx(entry.latlng, entry.radius), {
                fillStyle: MAP_STYLE.threatCircle.canvasFillStyle,
                strokeStyle: MAP_STYLE.threatCircle.color,
                lineWidth: MAP_STYLE.threatCircle.weight,
                dashPattern: MAP_STYLE.threatCircle.dashPattern
            });
        }
        if (entry.label) {
            drawCanvasText(ctx, entry.label, center, MAP_STYLE.threatText);
        }
    });
}

function renderSteerpointLinesCanvas(ctx) {
    getSteerpointLines().forEach((line) => {
        drawCanvasPolyline(ctx, line, MAP_STYLE.steerpointLine);
    });
}

map.setView([-imageWidth/2, imageHeight/2], -2);
const initialBullseye = {
    lat: {% if bullseye.lat is not none %}{{bullseye.lat}}{% else %}null{% endif %},
    lng: {% if bullseye.lng is not none %}{{bullseye.lng}}{% else %}null{% endif %}
};
if (Number.isFinite(initialBullseye.lat) && Number.isFinite(initialBullseye.lng)) {
    setBullseye(initialBullseye);
} else {
    setBullseye(map.getCenter());
}

function drawMap(url) {
// dimensions of the image
    mapBaseDataUrl = url;
    map_overlay.setUrl(url);
    drawings.clearLayers();
    rebuildMapCoords();
    renderFlightPlanLeaflet();
    renderThreatsLeaflet();
    renderSteerpointLinesLeaflet();
    drawings.addTo(map);
    if (localStorage.getItem('onrefresh') == "reset") {
			map.setView([-imageWidth/2, imageHeight/2], -2);
			}
}

drawMap("assets/maps/map.png?v=" + Date.now());

map.on("dblclick", function(ev) {
    setBullseye(ev.latlng);
});

document.getElementById('mapInput')
    .addEventListener('change', function () {
	let fr = new FileReader();
	fr.onload = function () {
	    drawMap(fr.result);
	}
	fr.readAsDataURL(this.files[0]);
    })

async function toDataUrl(url) {
    if (!url || url.startsWith("data:")) return url;
    try {
        const res = await fetch(url);
        const blob = await res.blob();
        return await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(blob);
        });
    } catch (e) {
        return null;
    }
}

async function ensureMapFontsLoaded() {
    if (!document.fonts || typeof document.fonts.load !== "function") return;
    await Promise.all([
        document.fonts.load('700 12px "Map Overlay Mono"'),
        document.fonts.load('400 12px "Map Overlay Mono"')
    ]);
}

async function exportMapImage() {
    try {
        window.exportMapLog = [];
        const el = document.getElementById("image-map");
        if (!el) {
            window.exportMapLastError = "No map element";
            return null;
        }
        const baseData = await toDataUrl(mapBaseDataUrl || "assets/maps/map.png");
        if (baseData) {
            if (mapBaseDataUrl !== baseData) {
                mapBaseDataUrl = baseData;
                window.exportMapLog.push("Loaded base map data URL, length " + baseData.length);
                await new Promise((res) => {
                    const imgEl = map_overlay.getElement();
                    const onload = () => { res(); imgEl.removeEventListener("load", onload); };
                    imgEl.addEventListener("load", onload);
                    map_overlay.setUrl(baseData);
                });
            }
        } else {
            window.exportMapLastError = "Base map toDataUrl failed";
            window.exportMapLog.push(window.exportMapLastError);
            return null;
        }
        await ensureMapFontsLoaded();
        await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
        const size = map.getSize();
        const canvas = document.createElement("canvas");
        canvas.width = size.x * MAP_EXPORT_SCALE;
        canvas.height = size.y * MAP_EXPORT_SCALE;
        const ctx = canvas.getContext("2d");
        ctx.scale(MAP_EXPORT_SCALE, MAP_EXPORT_SCALE);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, size.x, size.y);

        // base map
        const baseImg = new Image();
        baseImg.crossOrigin = "anonymous";
        baseImg.src = mapBaseDataUrl;
        await new Promise((res, rej) => {
            baseImg.onload = res;
            baseImg.onerror = (e) => {
                window.exportMapLastError = "Base image load failed";
                window.exportMapLog.push(window.exportMapLastError);
                rej(e);
            };
        });
        const baseRect = getOverlayDrawRect(map_overlay);
        ctx.drawImage(baseImg, baseRect.x, baseRect.y, baseRect.width, baseRect.height);

        // bullseye
        try {
            const bullImgEl = bullseye_overlay.getElement();
            const bullSrc = await toDataUrl(bullImgEl?.src || "assets/bullseye.png") || bullImgEl?.src;
            const bullImg = new Image();
            bullImg.crossOrigin = "anonymous";
            bullImg.src = bullSrc;
            await new Promise((res, rej) => {
                if (bullImg.complete) res();
                else {
                    bullImg.onload = res;
                    bullImg.onerror = (e) => {
                        window.exportMapLastError = "Bullseye load failed";
                        window.exportMapLog.push(window.exportMapLastError);
                        rej(e);
                    };
                }
            });
            const bullseyeRect = getOverlayDrawRect(bullseye_overlay);
            ctx.drawImage(bullImg, bullseyeRect.x, bullseyeRect.y, bullseyeRect.width, bullseyeRect.height);
        } catch {}
        renderFlightPlanCanvas(ctx);
        renderThreatsCanvas(ctx);
        renderSteerpointLinesCanvas(ctx);

        const dataUrl = canvas.toDataURL("image/png");
        window.exportMapLastError = "ok:" + (dataUrl ? dataUrl.length : 0);
        window.exportMapLog.push(window.exportMapLastError);
        return dataUrl;
    } catch (e) {
        window.exportMapLastError = e?.message || e || "Unknown error";
        window.exportMapLog.push(window.exportMapLastError);
        return null;
    }
}

window.exportMapImage = exportMapImage;

</script>
