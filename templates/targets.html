<style>
  tr.primary {
      font-weight: bold;
  }
  .target-ref-browse {
      margin-left: 0.35em;
  }
  .target-ref-input {
      display: none;
  }
  .target-ref-cell {
      min-height: 1em;
      vertical-align: top;
      background: #ffffff;
      position: relative;
  }
  .target-ref-cell:empty::before {
      content: "Paste image";
      color: #666666;
      font-style: italic;
      display: block;
      padding-top: 0.1em;
  }
  @media print {
      .target-ref-cell:empty::before {
          display: none;
      }
  }
  .target-ref-cell img {
      display: block;
      max-width: 100%;
      height: auto;
      width: auto;
      margin: 0 auto;
  }
</style>
<table width=100%>
      <tr>
<th class="header clickable" onclick="toggleVisHeader(this)" id="targets_header"><span class="arrow">▼</span>Targets</th>
  </tr>
</table>
<table width=100% id="targets" class="hidable">
    <colgroup>
        <col style="width:10%;">
        <col style="width:30%;">
        <col style="width:30%;">
        <col style="width:30%;">
    </colgroup>
    <thead>
      <tr>
	  <th class="header"></th>
	  <th class="header">TGT 1: <button type="button" class="refreshButton target-ref-browse" onclick="event.stopPropagation(); document.getElementById('tgt1Input').click();">Browse</button><input type="file" accept="image/*" id="tgt1Input" class="imageFileInput target-ref-input"></th>
	  <th class="header">TGT 2: <button type="button" class="refreshButton target-ref-browse" onclick="event.stopPropagation(); document.getElementById('tgt2Input').click();">Browse</button><input type="file" accept="image/*" id="tgt2Input" class="imageFileInput target-ref-input"></th>
	  <th class="header">MISC: <button type="button" class="refreshButton target-ref-browse" onclick="event.stopPropagation(); document.getElementById('tgt3Input').click();">Browse</button><input type="file" accept="image/*" id="tgt3Input" class="imageFileInput target-ref-input"></th>
      </tr>
    </thead>
    <tbody>
      <tr>
	<td class="header">Loc.</td>
	<td contenteditable="true" class="editable" id="targets_1"></td>
	<td contenteditable="true" class="editable" id="targets_2"></td>
	<td contenteditable="true" class="editable" id="targets_3"></td>
      </tr>
      <tr>
	<td class="header">Descr.</td>
	<td contenteditable="true" class="editable" id="targets_4"></td>
	<td contenteditable="true" class="editable" id="targets_5"></td>
	<td contenteditable="true" class="editable" id="targets_6"></td>
      </tr>
      <tr id="refImageRow">
	<td class="header">REF. <button class="refreshButton" onclick='removeRefImg()'>⟳</button></td>
	<td contenteditable="true" class="editable target-ref-cell" id="tgt1Ref"></td>
	<td contenteditable="true" class="editable target-ref-cell" id="tgt2Ref"></td>
	<td contenteditable="true" class="editable target-ref-cell" id="tgt3Ref"></td>
	</tr>
    </tbody>
</table>
<script>
  function setTargetRefImage(cellId, dataUrl) {
      const cell = document.getElementById(cellId);
      if (!cell) return;
      if (!dataUrl) {
          cell.innerHTML = "";
          return;
      }
      cell.innerHTML = '<img src="' + dataUrl + '" alt="">';
  }

  function bindTargetRefInput(inputId, cellId) {
      document.getElementById(inputId)
          .addEventListener('change', function () {
	      const file = this.files && this.files[0];
	      if (!file) return;
	      let fr = new FileReader();
	      fr.onload = function () {
	          setTargetRefImage(cellId, fr.result);
	      };
	      fr.readAsDataURL(file);
          });
  }

bindTargetRefInput('tgt1Input', 'tgt1Ref');
bindTargetRefInput('tgt2Input', 'tgt2Ref');
bindTargetRefInput('tgt3Input', 'tgt3Ref');

  function removeRefImg() {
document.getElementById('tgt1Input').value="";
document.getElementById('tgt2Input').value="";
document.getElementById('tgt3Input').value="";
document.getElementById('tgt1Ref').innerHTML="";
document.getElementById('tgt2Ref').innerHTML="";
document.getElementById('tgt3Ref').innerHTML="";
  }
</script>
