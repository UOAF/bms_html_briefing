<script>
const MAP_BASE_MODE = {{ map_base_mode|default("local_tiles")|tojson }};
const IS_WEB_MAP = MAP_BASE_MODE === "web";
const THEATER_NAME = {{ theater_name|default("")|tojson }};
const WEB_TILE_URL_TEMPLATE = {{ web_tile_url_template|tojson }};
const WEB_TILE_ATTRIBUTION = {{ web_tile_attribution|default("Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community")|tojson }};
const WEB_TILE_FILTER = {{ web_tile_filter|default("")|tojson }};
const WEB_TILE_LAYERS = {{ web_tile_layers|default([])|tojson }};
const WEB_TILE_MAX_ZOOM = {{ web_tile_max_zoom|default(19)|tojson }};
const BULLSEYE_RING_NM = Array.from({ length: 20 }, (_, index) => (index + 1) * 25);
const BULLSEYE_STROKE = "#009900";
const NM_TO_FEET = 6076.12;

const mapOptions = {
	zoomControl: false,
	doubleClickZoom: false,
};
if (IS_WEB_MAP) {
	mapOptions.minZoom = 2;
	mapOptions.maxZoom = WEB_TILE_MAX_ZOOM;
	mapOptions.zoom = 7;
} else {
	mapOptions.minZoom = -3;
	mapOptions.maxZoom = 5;
	mapOptions.zoom = -2;
	mapOptions.crs = L.CRS.Simple;
}

var map = L.map('image-map', mapOptions);

var imageWidth = 4096,
    imageHeight = 4096;

var southWest = null;
var northEast = null;
var bounds = null;

if (!IS_WEB_MAP) {
    southWest = map.unproject([0, imageHeight], 0);
    northEast = map.unproject([imageWidth, 0], 0);
    bounds = new L.LatLngBounds(southWest, northEast);
    map.setMaxBounds([southWest, northEast]);
} else {
    map.createPane("webBasemap");
    const webBasemapPane = map.getPane("webBasemap");
    webBasemapPane.style.zIndex = 200;
}

let mapBaseDataUrl = null;
map_overlay = IS_WEB_MAP ? null : L.imageOverlay("", bounds, { crossOrigin: true }).addTo(map);
let bullseyeLatLng = null;
bullseye_overlay = L.layerGroup().addTo(map);
bullseye_overlay.getCenter = function() {
    return bullseyeLatLng || map.getCenter();
};
let map_tile_layers = [];
let mapBaseMode = IS_WEB_MAP ? "web" : "image";

function getBullseyeSpokeLatLngs(centerLatLng, bearingDegrees) {
    const centerPoint = map.latLngToLayerPoint(centerLatLng);
    const size = map.getSize();
    const length = Math.max(size.x, size.y) * 8;
    const angle = bearingDegrees * Math.PI / 180;
    const dx = Math.sin(angle) * length;
    const dy = -Math.cos(angle) * length;
    return [
        map.layerPointToLatLng(L.point(centerPoint.x - dx, centerPoint.y - dy)),
        centerLatLng,
        map.layerPointToLatLng(L.point(centerPoint.x + dx, centerPoint.y + dy))
    ];
}

function getBullseyeRadius(radiusNm) {
    return IS_WEB_MAP ? radiusNm * 1852 : convertScalar(radiusNm * NM_TO_FEET);
}

function setBullseye(latlng) {
    bullseyeLatLng = L.latLng(latlng);
    bullseye_overlay.clearLayers();
    L.circleMarker(bullseyeLatLng, {
        radius: 5,
        color: BULLSEYE_STROKE,
        weight: 1,
        fillColor: BULLSEYE_STROKE,
        fillOpacity: 0.85,
        opacity: 0.85
    }).addTo(bullseye_overlay);
    BULLSEYE_RING_NM.forEach((radiusNm) => {
        L.circle(bullseyeLatLng, {
            radius: getBullseyeRadius(radiusNm),
            color: BULLSEYE_STROKE,
            weight: 1,
            opacity: 0.72,
            fillOpacity: 0
        }).addTo(bullseye_overlay);
    });
    for (let bearing = 0; bearing < 360; bearing += 45) {
        L.polyline(getBullseyeSpokeLatLngs(bullseyeLatLng, bearing), {
            color: BULLSEYE_STROKE,
            weight: 1,
            opacity: 0.72
        }).addTo(bullseye_overlay);
    }
}
 
drawings = L.layerGroup();

// dimensions of the Falcon map
var fWidth = 3359580,
    fHeight = 3359580;

const MAP_STYLE = {

    },

    }
};

const MAP_EXPORT_SCALE = 1;

const LEAFLET_TOOLTIP_OPTS = {
    flightPoint: { direction: "center", permanent: true, opacity: 0.9, className: "leaflet-tooltip-fp" },
    threat: { direction: "bottom", permanent: true, opacity: 1, className: "leaflet-tooltip-threat" },
    alt: { direction: "bottom", permanent: true, opacity: 1, className: "leaflet-tooltip-anchor" }
};

const FEET_TO_METERS = 0.30488;
const WGS84_A = 6378137.0;
const WGS84_E2 = 0.00669437999014;
const DEFAULT_THEATER_SIZE_KM = 1024;
// Projection construction follows the Falcon BMS theater PROJ definitions used by falcon-bms-tacview-converter https://github.com/oakdesign/falcon-bms-tacview-converter/.
const THEATER_FALLBACK_CENTERS = {
    korea: [38.5, 127.5],
    balkans: [41.8327, 16.4191],
    israel: [32.0, 35.0],
    hellas: [38.0, 25.0150]
};
const CONFIGURED_THEATER_CENTER = {
    lat: {% if theater_center_latitude is defined and theater_center_latitude is not none %}{{ theater_center_latitude }}{% else %}null{% endif %},
    lng: {% if theater_center_longitude is defined and theater_center_longitude is not none %}{{ theater_center_longitude }}{% else %}null{% endif %}
};
const CONFIGURED_THEATER_SIZE_KM = {% if theater_size_km is defined and theater_size_km is not none %}{{ theater_size_km }}{% else %}null{% endif %};

function getTheaterFallbackCenter() {
    const name = (THEATER_NAME || "").toLowerCase();
    if (name.includes("balkan")) return THEATER_FALLBACK_CENTERS.balkans;
    if (name.includes("israel")) return THEATER_FALLBACK_CENTERS.israel;
    if (name.includes("hellas")) return THEATER_FALLBACK_CENTERS.hellas;
    if (name.includes("korea") || name.includes("kto") || !name) return THEATER_FALLBACK_CENTERS.korea;
    return THEATER_FALLBACK_CENTERS.korea;
}

function getTheaterCenter() {
    if (Number.isFinite(CONFIGURED_THEATER_CENTER.lat) && Number.isFinite(CONFIGURED_THEATER_CENTER.lng)) {
        return [CONFIGURED_THEATER_CENTER.lat, CONFIGURED_THEATER_CENTER.lng];
    }
    return getTheaterFallbackCenter();
}

function getTheaterSizeMeters() {
    const sizeKm = Number.isFinite(CONFIGURED_THEATER_SIZE_KM) && CONFIGURED_THEATER_SIZE_KM > 0
        ? CONFIGURED_THEATER_SIZE_KM
        : DEFAULT_THEATER_SIZE_KM;
    return sizeKm * 1000;
}

function meridionalArc(latRadians) {
    return WGS84_A * (
        (1 - WGS84_E2 / 4 - 3 * WGS84_E2 ** 2 / 64 - 5 * WGS84_E2 ** 3 / 256) * latRadians
        - (3 * WGS84_E2 / 8 + 3 * WGS84_E2 ** 2 / 32 + 45 * WGS84_E2 ** 3 / 1024) * Math.sin(2 * latRadians)
        + (15 * WGS84_E2 ** 2 / 256 + 45 * WGS84_E2 ** 3 / 1024) * Math.sin(4 * latRadians)
        - (35 * WGS84_E2 ** 3 / 3072) * Math.sin(6 * latRadians)
    );
}

function getTheaterProjection() {
    const center = getTheaterCenter();
    const theaterSizeMeters = getTheaterSizeMeters();
    const k0 = 0.9996;
    const centerNorthing = theaterSizeMeters / 2;
    const centerLatRadians = center[0] * Math.PI / 180;
    return {
        lon0: center[1],
        k0: k0,
        falseEasting: theaterSizeMeters / 2,
        falseNorthing: centerNorthing - meridionalArc(centerLatRadians) * k0,
        center: center,
        sizeMeters: theaterSizeMeters
    };
}

function inverseTransverseMercator(eastingMeters, northingMeters, projection) {
    const lon0 = projection.lon0 * Math.PI / 180;
    const e1 = (1 - Math.sqrt(1 - WGS84_E2)) / (1 + Math.sqrt(1 - WGS84_E2));
    const m = (northingMeters - projection.falseNorthing) / projection.k0;
    const mu = m / (WGS84_A * (1 - WGS84_E2 / 4 - 3 * WGS84_E2 ** 2 / 64 - 5 * WGS84_E2 ** 3 / 256));
    const phi1 = mu
        + (3 * e1 / 2 - 27 * e1 ** 3 / 32) * Math.sin(2 * mu)
        + (21 * e1 ** 2 / 16 - 55 * e1 ** 4 / 32) * Math.sin(4 * mu)
        + (151 * e1 ** 3 / 96) * Math.sin(6 * mu)
        + (1097 * e1 ** 4 / 512) * Math.sin(8 * mu);
    const ep2 = WGS84_E2 / (1 - WGS84_E2);
    const sinPhi1 = Math.sin(phi1);
    const cosPhi1 = Math.cos(phi1);
    const tanPhi1 = Math.tan(phi1);
    const c1 = ep2 * cosPhi1 ** 2;
    const t1 = tanPhi1 ** 2;
    const n1 = WGS84_A / Math.sqrt(1 - WGS84_E2 * sinPhi1 ** 2);
    const r1 = WGS84_A * (1 - WGS84_E2) / ((1 - WGS84_E2 * sinPhi1 ** 2) ** 1.5);
    const d = (eastingMeters - projection.falseEasting) / (n1 * projection.k0);
    const lat = phi1 - (n1 * tanPhi1 / r1) * (
        d ** 2 / 2
        - (5 + 3 * t1 + 10 * c1 - 4 * c1 ** 2 - 9 * ep2) * d ** 4 / 24
        + (61 + 90 * t1 + 298 * c1 + 45 * t1 ** 2 - 252 * ep2 - 3 * c1 ** 2) * d ** 6 / 720
    );
    const lon = lon0 + (
        d
        - (1 + 2 * t1 + c1) * d ** 3 / 6
        + (5 - 2 * c1 + 28 * t1 - 3 * c1 ** 2 + 8 * ep2 + 24 * t1 ** 2) * d ** 5 / 120
    ) / cosPhi1;
    return [lat * 180 / Math.PI, lon * 180 / Math.PI];
}

function convertBmsCoordToLatLng(xFeet, yFeet) {
    const projection = getTheaterProjection();
    if (!projection) return [NaN, NaN];
    return inverseTransverseMercator(yFeet * FEET_TO_METERS, xFeet * FEET_TO_METERS, projection);
}

function convertCmpBullseyeToLatLng(rawX, rawY, gridSizeX, gridSizeY) {
    const x = parseFloat(rawX);
    const y = parseFloat(rawY);
    if (!Number.isFinite(x) || !Number.isFinite(y)) return [NaN, NaN];
    const gridX = Number.isFinite(gridSizeX) && gridSizeX > 0 ? gridSizeX : 1024;
    const gridY = Number.isFinite(gridSizeY) && gridSizeY > 0 ? gridSizeY : 1024;
    const eastFeet = Math.abs(x) <= gridX * 2 ? (x / gridX) * fWidth : x;
    const northFeet = Math.abs(y) <= gridY * 2 ? (y / gridY) * fHeight : y;
    return convertBmsCoordToLatLng(northFeet, eastFeet);
}

function convertScalar(iniScalar) {
    const num = parseFloat(iniScalar);
    if (!Number.isFinite(num)) return 0;
    return num/fHeight*imageHeight;
}

function convertDistance(iniScalar) {
    const num = parseFloat(iniScalar);
    if (!Number.isFinite(num)) return 0;
    return IS_WEB_MAP ? num * FEET_TO_METERS : convertScalar(num);
}

function convertCoord(iniCoord) {
    if (!iniCoord || iniCoord.length < 2) return [0,0];
    const x = parseFloat(iniCoord[0]);
    const y = parseFloat(iniCoord[1]);
    if (!Number.isFinite(x) || !Number.isFinite(y)) return [0,0];
    if (IS_WEB_MAP) return convertBmsCoordToLatLng(x, y);
    return [convertScalar(x) - imageHeight, convertScalar(y)];
}

window.exportMapLastError = null;
window.exportMapLog = [];


  let stptIniCoords = [{% for point in stpt_coords %}
		       [ {{point.coord_x}}, {{point.coord_y}}],
		       {% endfor %}]

    stptMapCoords = [];

let tstptIniCoords = [{% for point in tstpt_coords %}
		      [ [{{point.coord_x}}, {{point.coord_y}}], "{{point.radius}}", "{{point.name}}" ],
		       {% endfor %}]
tstptMapCoords = [];

let tgtStptIniCoords = [{% for point in tgtsteerpoints %}
              [ [{{point.coord_x}}, {{point.coord_y}}], {{point.number}}, {{point.name|tojson}} ],
               {% endfor %}]
tgtStptMapCoords = [];

let stptLineIniCoords = [{% for line in stpt_lines %}
			 [{% for point in line %}
		       [{{point.coord_x}}, {{point.coord_y}}],
			  {% endfor %}],
		       {% endfor %}]

stptLineMapCoords = [[],[],[],[]];

function validLatLng(latlng) {
    return Array.isArray(latlng) && latlng.length >= 2 && Number.isFinite(latlng[0]) && Number.isFinite(latlng[1]);
}

function rebuildMapCoords() {
    stptMapCoords = stptIniCoords.map(convertCoord);
    tstptMapCoords = tstptIniCoords.map((entry) => {
        const radiusVal = parseFloat(entry[1]);
        return [
            convertCoord(entry[0]),
            Number.isFinite(radiusVal) ? convertDistance(radiusVal) : 0,
            entry[2] || ""
        ];
    });
    tgtStptMapCoords = tgtStptIniCoords.map((entry) => [
        convertCoord(entry[0]),
        entry[1],
        entry[2] || ""
    ]);
    stptLineMapCoords = stptLineIniCoords.map((line) => line.map(convertCoord));
}

function getFlightRouteCoords() {
    return stptMapCoords.slice(0, -1).filter(validLatLng);
}

function getFlightPointEntries() {
    return stptMapCoords
        .map((latlng, index) => ({ latlng, index }))
        .filter((entry) => entry.index > 0 && entry.index < stptMapCoords.length - 1 && validLatLng(entry.latlng));
}

function getEndpointEntries() {
    const entries = [];
    const startLatLng = stptMapCoords[0];
    const endLatLng = stptMapCoords[stptMapCoords.length - 1];
    if (validLatLng(startLatLng)) {
        entries.push({ kind: "start", latlng: startLatLng });
    }
    if (validLatLng(endLatLng)) {
        entries.push({ kind: "end", latlng: endLatLng });
    }
    return entries;
}

function getPenultimateEntry() {
    if (stptMapCoords.length < 2) return null;
    const latlng = stptMapCoords[stptMapCoords.length - 2];
    if (!validLatLng(latlng)) return null;
    return { latlng, index: stptMapCoords.length - 2 };
}

function getAnchorLabels() {
    const labels = [];
    const altLatLng = stptMapCoords[stptMapCoords.length - 1];
    if (validLatLng(altLatLng)) {
        labels.push({ text: "ALT", latlng: altLatLng, tooltipOptions: LEAFLET_TOOLTIP_OPTS.alt });
    }
    return labels;
}

function getThreatEntries() {
    return tstptMapCoords
        .map((entry) => ({
            latlng: entry && entry[0],
            radius: entry && Number.isFinite(entry[1]) ? entry[1] : 0,
            label: entry && entry.length > 2 ? entry[2] : ""
        }))
        .filter((entry) => validLatLng(entry.latlng));
}

function getTargetSteerpointEntries() {
    return tgtStptMapCoords
        .map((entry) => ({

        .replace(/</g, "&lt;")

function getOverlayDrawRect(overlay) {
    const sw = overlay.getBounds().getSouthWest();
    const ne = overlay.getBounds().getNorthEast();
    const topLeft = map.latLngToContainerPoint(ne);
    const bottomRight = map.latLngToContainerPoint(sw);
    return {
        x: topLeft.x,
        y: topLeft.y,
        width: bottomRight.x - topLeft.x,
        height: bottomRight.y - topLeft.y
    };
}

function latLngToCanvasPoint(latlng) {
    return map.latLngToContainerPoint(latlng);
}

function getThreatRadiusPx(centerLatLng, radius) {
    const center = latLngToCanvasPoint(centerLatLng);
    if (IS_WEB_MAP) {
        const latlng = L.latLng(centerLatLng);
        const edgeLatLng = L.latLng(latlng.lat + (radius / 111320), latlng.lng);
        const edge = latLngToCanvasPoint(edgeLatLng);
        return Math.abs(edge.y - center.y);
    }
    const edge = latLngToCanvasPoint([centerLatLng[0] + radius, centerLatLng[1]]);
    return Math.abs(edge.y - center.y);
}

function drawCanvasPolyline(ctx, latlngs, style) {
    const validPoints = latlngs.filter(validLatLng);
    if (validPoints.length === 0) return;
    ctx.save();
    const drawPath = () => {
        ctx.beginPath();
        validPoints.forEach((latlng, index) => {
            const point = latLngToCanvasPoint(latlng);
            if (index === 0) ctx.moveTo(point.x, point.y);
            else ctx.lineTo(point.x, point.y);
        });
    };
    ctx.lineJoin = style.lineJoin || "miter";
    ctx.setLineDash(Array.isArray(style.dashPattern) ? style.dashPattern : []);
    if (style.haloColor && style.haloWeight) {
        ctx.strokeStyle = style.haloColor;
        ctx.lineWidth = style.haloWeight;
        drawPath();
        ctx.stroke();
    }
    ctx.strokeStyle = style.color;
    ctx.lineWidth = style.weight;
    drawPath();
    ctx.stroke();
    ctx.restore();
}

function drawCanvasCircle(ctx, point, radius, style) {
    ctx.save();
    ctx.setLineDash(Array.isArray(style.dashPattern) ? style.dashPattern : []);
    ctx.beginPath();
    ctx.arc(point.x, point.y, radius, 0, 2 * Math.PI);
    if (style.fillStyle) {
        ctx.fillStyle = style.fillStyle;
        ctx.fill();
    }
    if (style.strokeStyle) {
        ctx.strokeStyle = style.strokeStyle;
        ctx.lineWidth = style.lineWidth || 1;
        ctx.stroke();
    }
    ctx.restore();
}

function drawCanvasDiamond(ctx, point, radius, style) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(point.x, point.y - radius);
    ctx.lineTo(point.x + radius, point.y);
    ctx.lineTo(point.x, point.y + radius);
    ctx.lineTo(point.x - radius, point.y);
    ctx.closePath();
    if (style.fillStyle) {
        ctx.fillStyle = style.fillStyle;
        ctx.fill();
    }
    if (style.strokeStyle) {
        ctx.strokeStyle = style.strokeStyle;
        ctx.lineWidth = style.lineWidth || 1;
        ctx.stroke();
    }
    ctx.restore();
}

function drawCanvasText(ctx, text, point, style) {
    ctx.save();
    ctx.font = style.font;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.miterLimit = 1.5;
    if (style.textAlign) ctx.textAlign = style.textAlign;
    if (style.textBaseline) ctx.textBaseline = style.textBaseline;
    const x = point.x + (style.offsetX || 0);
    const y = point.y + (style.offsetY || 0);
    if (style.strokeStyle) {
        ctx.strokeStyle = style.strokeStyle;
        ctx.lineWidth = style.lineWidth || 1;
        ctx.strokeText(text, x, y);
    }
    if (style.fillStyle || style.color) {
        ctx.fillStyle = style.fillStyle || style.color;
        ctx.fillText(text, x, y);
    }
    ctx.restore();
}

function renderFlightPlanCanvas(ctx) {
    drawCanvasPolyline(ctx, getFlightRouteCoords(), MAP_STYLE.flightPath);
    getEndpointEntries().forEach((entry) => {
        const point = latLngToCanvasPoint(entry.latlng);

        drawCanvasCircle(ctx, point, style.radius, {
            fillStyle: style.fillOpacity > 0 ? style.fillColor : null,
            strokeStyle: style.color,
            lineWidth: style.weight
        });
    });
    const penultimateEntry = getPenultimateEntry();
    if (penultimateEntry) {
        drawCanvasCircle(ctx, latLngToCanvasPoint(penultimateEntry.latlng), MAP_STYLE.penultimateMarker.radius, {
            fillStyle: MAP_STYLE.penultimateMarker.fillOpacity > 0 ? MAP_STYLE.penultimateMarker.fillColor : null,
            strokeStyle: MAP_STYLE.penultimateMarker.color,
            lineWidth: MAP_STYLE.penultimateMarker.weight,
            dashPattern: MAP_STYLE.penultimateMarker.dashPattern
        });
    }
    getFlightPointEntries().forEach((entry) => {
        const point = latLngToCanvasPoint(entry.latlng);
        drawCanvasCircle(ctx, point, MAP_STYLE.flightMarker.radius, {
            fillStyle: MAP_STYLE.flightMarker.canvasFillStyle,
            strokeStyle: MAP_STYLE.flightMarker.canvasStrokeStyle,
            lineWidth: 1
        });

    getAnchorLabels().forEach((entry) => {
        const point = latLngToCanvasPoint(entry.latlng);
        drawCanvasCircle(ctx, point, MAP_STYLE.anchorCenter.radius, {
            fillStyle: MAP_STYLE.anchorCenter.color,
            strokeStyle: MAP_STYLE.anchorCenter.strokeColor,

    gridSizeY: {% if bullseye.map_grid_size_y is defined and bullseye.map_grid_size_y is not none %}{{bullseye.map_grid_size_y}}{% else %}null{% endif %}
};
if (IS_WEB_MAP && Number.isFinite(initialBullseye.x) && Number.isFinite(initialBullseye.y)) {

function removeMapTileLayers() {
    map_tile_layers.forEach((layer) => {
        if (layer && map.hasLayer(layer)) {
            map.removeLayer(layer);
        }
    });
    map_tile_layers = [];
}

function getWebTileLayerDefs() {
    if (Array.isArray(WEB_TILE_LAYERS) && WEB_TILE_LAYERS.length > 0) {
        return WEB_TILE_LAYERS;
    }
    if (!WEB_TILE_URL_TEMPLATE) return [];
    return [{
        url_template: WEB_TILE_URL_TEMPLATE,
        attribution: WEB_TILE_ATTRIBUTION,
        filter: WEB_TILE_FILTER
    }];
}

function layerDefValue(layerDef, camelName, snakeName) {
    if (!layerDef) return "";
    return layerDef[camelName] || layerDef[snakeName] || "";
}

function drawMap(url) {
    if (IS_WEB_MAP) return;
// dimensions of the image
    mapBaseMode = "image";
    mapBaseDataUrl = url;
    removeMapTileLayers();
    if (!map.hasLayer(map_overlay)) {
        map_overlay.addTo(map);
    }
    map_overlay.setUrl(url);
    drawings.clearLayers();
    rebuildMapCoords();
    renderFlightPlanLeaflet();
    renderTargetSteerpointsLeaflet();

function drawTiledMap(urlTemplate) {
    mapBaseMode = "tiles";
    mapBaseDataUrl = null;
    if (map.hasLayer(map_overlay)) {
        map.removeLayer(map_overlay);
    }
    removeMapTileLayers();
    const tileLayer = L.tileLayer(urlTemplate, {
        minZoom: -3,
        maxZoom: 5,
        minNativeZoom: -3,
        maxNativeZoom: {% if map_tile_max_native_zoom is defined %}{{ map_tile_max_native_zoom }}{% else %}0{% endif %},
        tileSize: 256,
        bounds: bounds,
        noWrap: true,
        updateWhenIdle: true
    }).addTo(map);
    map_tile_layers = [tileLayer];
    drawings.clearLayers();
    rebuildMapCoords();
    renderFlightPlanLeaflet();
    renderTargetSteerpointsLeaflet();
    renderThreatsLeaflet();
    renderSteerpointLinesLeaflet();
    drawings.addTo(map);
    resetMapView(false);
}

function drawWebMap() {
    mapBaseMode = "web";
    mapBaseDataUrl = null;
    if (map_overlay && map.hasLayer(map_overlay)) {
        map.removeLayer(map_overlay);
    }
    removeMapTileLayers();
    getWebTileLayerDefs().forEach((layerDef, index) => {
        const layerUrlTemplate = layerDefValue(layerDef, "urlTemplate", "url_template");
        if (!layerUrlTemplate) return;
        const paneName = index === 0 ? "webBasemap" : "webBasemap" + index;
        if (!map.getPane(paneName)) {
            map.createPane(paneName);
        }
        const pane = map.getPane(paneName);
        pane.style.zIndex = String(200 + index);
        pane.style.filter = layerDefValue(layerDef, "filter", "filter") || "";
        const tileLayer = L.tileLayer(layerUrlTemplate, {
            minZoom: 2,
            maxZoom: WEB_TILE_MAX_ZOOM,
            maxNativeZoom: Number(layerDefValue(layerDef, "maxNativeZoom", "max_native_zoom")) || WEB_TILE_MAX_ZOOM,
            tileSize: 256,
            keepBuffer: 4,
            pane: paneName,
            crossOrigin: "anonymous",
            attribution: layerDefValue(layerDef, "attribution", "attribution"),
            updateWhenIdle: false,
            updateWhenZooming: false
        }).addTo(map);
        map_tile_layers.push(tileLayer);
    });
    drawings.clearLayers();
    rebuildMapCoords();
    renderFlightPlanLeaflet();
    renderTargetSteerpointsLeaflet();
    renderThreatsLeaflet();
    renderSteerpointLinesLeaflet();
    drawings.addTo(map);
    resetMapView(true);
}

async function toDataUrl(url) {
    if (!url || url.startsWith("data:")) return url;
    try {
        const res = await fetch(url);
        const blob = await res.blob();
        return await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(blob);
        });
    } catch (e) {
        return null;
    }
}

async function ensureMapFontsLoaded() {
    if (!document.fonts || typeof document.fonts.load !== "function") return;
    await Promise.all([
        document.fonts.load('700 12px "Map Overlay Mono"'),
        document.fonts.load('400 12px "Map Overlay Mono"')
    ]);
}

function waitForVisibleTiles() {
    if ((mapBaseMode !== "tiles" && mapBaseMode !== "web") || map_tile_layers.length === 0) return Promise.resolve();
    return Promise.all(map_tile_layers.map((tileLayer) => new Promise((resolve) => {
        let settled = false;
        const done = () => {
            if (settled) return;
            settled = true;
            tileLayer.off("load", done);
            setTimeout(resolve, 0);
        };
        tileLayer.on("load", done);
        setTimeout(done, 1500);
        tileLayer.redraw();
    }))).then(() => undefined);
}

function renderBullseyeCanvas(ctx) {
    if (!bullseyeLatLng) return;
    const center = latLngToCanvasPoint(bullseyeLatLng);
    const spokeLength = Math.hypot(ctx.canvas.width, ctx.canvas.height);
    for (let bearing = 0; bearing < 360; bearing += 45) {
        const angle = bearing * Math.PI / 180;
        const dx = Math.sin(angle) * spokeLength;
        const dy = -Math.cos(angle) * spokeLength;
        ctx.save();
        ctx.strokeStyle = BULLSEYE_STROKE;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(center.x - dx, center.y - dy);
        ctx.lineTo(center.x + dx, center.y + dy);
        ctx.stroke();
        ctx.restore();
    }
    BULLSEYE_RING_NM.slice().reverse().forEach((radiusNm) => {
        drawCanvasCircle(ctx, center, getThreatRadiusPx(bullseyeLatLng, getBullseyeRadius(radiusNm)), {
            strokeStyle: BULLSEYE_STROKE,
            lineWidth: 1
        });
    });
    drawCanvasCircle(ctx, center, 5, {
        fillStyle: BULLSEYE_STROKE,
        strokeStyle: BULLSEYE_STROKE,
        lineWidth: 1
    });
}

async function waitForImageElement(img) {
    if (!img || img.complete) return;
    await new Promise((resolve) => {
        img.addEventListener("load", resolve, { once: true });
        img.addEventListener("error", resolve, { once: true });
    });
}

async function drawVisibleMapTiles(ctx) {
    await waitForVisibleTiles();
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    const containerRect = map.getContainer().getBoundingClientRect();
    const tileImgs = Array.from(map.getContainer().querySelectorAll("img.leaflet-tile"));
    await Promise.all(tileImgs.map(waitForImageElement));
    tileImgs.forEach((img) => {
        if (!img.complete || img.naturalWidth === 0 || img.naturalHeight === 0) return;
        const rect = img.getBoundingClientRect();
        const pane = img.closest(".leaflet-pane");
        const paneFilter = pane ? window.getComputedStyle(pane).filter : "";
        ctx.save();
        if (paneFilter && paneFilter !== "none") {
            ctx.filter = paneFilter;
        }
        ctx.drawImage(
            img,
            rect.left - containerRect.left,
            rect.top - containerRect.top,
            rect.width,
            rect.height
        );
        ctx.restore();
    });
}

async function exportMapImage() {
    try {
        window.exportMapLog = [];
        const el = document.getElementById("image-map");
        if (!el) {
            window.exportMapLastError = "No map element";
            return null;
        }
        if (mapBaseMode !== "tiles" && mapBaseMode !== "web") {
            const baseData = await toDataUrl(mapBaseDataUrl || "assets/maps/map.png");
            if (baseData) {
                if (mapBaseDataUrl !== baseData) {
                    mapBaseDataUrl = baseData;
                    window.exportMapLog.push("Loaded base map data URL, length " + baseData.length);
                    await new Promise((res) => {
                        const imgEl = map_overlay.getElement();
                        const onload = () => { res(); imgEl.removeEventListener("load", onload); };
                        imgEl.addEventListener("load", onload);
                        map_overlay.setUrl(baseData);
                    });
                }
            } else {
                window.exportMapLastError = "Base map toDataUrl failed";
                window.exportMapLog.push(window.exportMapLastError);
                return null;
            }
        }
        await ensureMapFontsLoaded();
        await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
        const size = map.getSize();
        const canvas = document.createElement("canvas");
        canvas.width = size.x * MAP_EXPORT_SCALE;
        canvas.height = size.y * MAP_EXPORT_SCALE;
        const ctx = canvas.getContext("2d");
        ctx.scale(MAP_EXPORT_SCALE, MAP_EXPORT_SCALE);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, size.x, size.y);

        // base map
        if (mapBaseMode === "tiles" || mapBaseMode === "web") {
            await drawVisibleMapTiles(ctx);
        } else {
            const baseImg = new Image();
            baseImg.crossOrigin = "anonymous";
            baseImg.src = mapBaseDataUrl;
            await new Promise((res, rej) => {
                baseImg.onload = res;
                baseImg.onerror = (e) => {
                    window.exportMapLastError = "Base image load failed";
                    window.exportMapLog.push(window.exportMapLastError);
                    rej(e);
                };
            });
            const baseRect = getOverlayDrawRect(map_overlay);
            ctx.drawImage(baseImg, baseRect.x, baseRect.y, baseRect.width, baseRect.height);
        }

        renderBullseyeCanvas(ctx);
        renderFlightPlanCanvas(ctx);
        renderThreatsCanvas(ctx);
        renderSteerpointLinesCanvas(ctx);
        renderTargetSteerpointsCanvas(ctx);

        const dataUrl = canvas.toDataURL("image/png");
        window.exportMapLastError = "ok:" + (dataUrl ? dataUrl.length : 0);
        window.exportMapLog.push(window.exportMapLastError);
        return dataUrl;
    } catch (e) {
        window.exportMapLastError = e?.message || e || "Unknown error";
        window.exportMapLog.push(window.exportMapLastError);
        return null;
    }
}

window.exportMapImage = exportMapImage;

</script>
