<script>
async function saveCustomChecklistTemplate(event) {
    if (event) {
        event.stopPropagation();
        event.preventDefault();
    }
    const btn = document.querySelector(".checklistSaveButton");
    const status = document.getElementById("checklist_save_status");
    const editables = document.querySelectorAll("[data-checklist-editable='1'][id]");
    const values = {};
    editables.forEach((el) => {
        values[el.id] = serializeEditableContent(el);
    });
    if (btn) btn.disabled = true;
    if (status) status.textContent = "Saving...";
    try {
        const response = await fetch("/api/custom-checklist/template", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ values })
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
            throw new Error(payload.detail || "Failed to save custom checklist");
        }
        if (status) status.textContent = "Saved";
        window.setTimeout(() => {
            if (status && status.textContent === "Saved") status.textContent = "";
        }, 2000);
    } catch (error) {
        if (status) status.textContent = "Save failed";
        console.error(error);
    } finally {
        if (btn) btn.disabled = false;
    }
}
</script>
