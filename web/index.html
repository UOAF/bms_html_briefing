<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Falcon BMS Briefing Server</title>
  <link rel="icon" type="image/png" href="/assets/icon.png">
  <style>
    @font-face {
      font-family: "IBMPlexMono";
      src: url("/assets/fonts/IBM_Plex_Mono/IBMPlexMono-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "IBMPlexMono";
      src: url("/assets/fonts/IBM_Plex_Mono/IBMPlexMono-Italic.ttf") format("truetype");
      font-weight: 400;
      font-style: italic;
    }
    @font-face {
      font-family: "IBMPlexMono";
      src: url("/assets/fonts/IBM_Plex_Mono/IBMPlexMono-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: "IBMPlexMono";
      src: url("/assets/fonts/IBM_Plex_Mono/IBMPlexMono-BoldItalic.ttf") format("truetype");
      font-weight: 700;
      font-style: italic;
    }

    @font-face {
      font-family: "Viper";
      src: url("/assets/fonts/viper-display/ViperDisplay-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: "Viper";
      src: url("/assets/fonts/viper-display/ViperDisplay-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
    }

    :root {
      color-scheme: dark;
      --bg: #000000;
      --panel-strong: #15273d;
      --text: #d8e7f5;
      --line: #66baff;
      --input: #0c1829;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      font-family: "Viper";
      background: var(--bg);
      color: var(--text);
    }

    body {
      margin: 0;
      padding: 0 1.25rem 2rem;
      background:
        var(--bg);
    }

    .page-wrap {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 1.25rem 0 0.75rem;
    }

    h1 {
      margin: 0;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--line);
      text-transform: uppercase;
    }

    h3 {
      text-transform: uppercase;
    }

    small {
      letter-spacing: 0.08em;
    }

    section {
      margin-top: 1rem;
      padding: 1rem 1.25rem;
      border: 1px solid rgb(255, 255, 255);
      border-radius: 0;
      background: var(--bg);
      box-shadow: var(--shadow);
    }

    label {
      display: block;
      margin-bottom: 0.35rem;
      color: var(--line);
      font-weight: 700;
      font-size: 0.88rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    input:not([type="checkbox"]),
    select {
      box-sizing: border-box;
      width: 100%;
      padding: 0.52rem 0.65rem;
      border: 1px solid #ffffff;
      border-radius: 0;
      background: var(--bg);
      color: #ffffff;
      font-family: "IBMPlexMono";
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      transition: border-color 120ms ease, box-shadow 120ms ease, color 120ms ease;
    }

    input:not([type="checkbox"])::placeholder {
      color: rgba(255, 255, 255, 0.56);
    }

    input:not([type="checkbox"]):focus,
    select:focus {
      outline: none;
      border-color: var(--line);
      box-shadow: inset 0 0 0 1px rgba(58, 167, 255, 0.45);
    }

    input:not([type="checkbox"])[readonly] {
      color: rgba(255, 255, 255, 0.82);
      border-color: rgba(255, 255, 255, 0.72);
    }

    select {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      padding-right: 1.9rem;
      background-image:
        linear-gradient(45deg, transparent 50%, #ffffff 50%),
        linear-gradient(135deg, #ffffff 50%, transparent 50%);
      background-position:
        calc(100% - 0.95rem) calc(50% - 0.1rem),
        calc(100% - 0.62rem) calc(50% - 0.1rem);
      background-size: 0.33rem 0.33rem, 0.33rem 0.33rem;
      background-repeat: no-repeat;
    }

    select option {
      background: #000000;
      color: #ffffff;
    }

    button {
      box-sizing: border-box;
      border: none;
      border-radius: 0;
      font-family: "Viper";
      font-weight: 700;
      font-size: medium;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition:
        transform 80ms ease,
        box-shadow 120ms ease,
        background 120ms ease,
        color 120ms ease;
    }

    button:disabled {
      cursor: not-allowed;
    }

    .grid {
      display: grid;
      gap: 0.75rem;
    }

    .grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    a {
      color: var(--line);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    #log {
      min-height: 120px;
      max-height: 260px;
      padding: 0.75rem 1rem;
      border: 1px solid rgb(255, 255, 255);
      border-radius: 0px;
      background: rgb(0, 0, 0);
      color: var(--text);
      font-family: "IBMPlexMono";
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      overflow-y: auto;
      box-shadow: inset 0 0 0 1px rgba(58, 167, 255, 0.08);
    }

    #brief-frame {
      display: block;
      width: 850px;
      max-width: 100%;
      height: 70vh;
      margin: 0 auto;
      border: 1px solid rgb(255, 255, 255);
      border-radius: 0px;
      background: #0a1310;
      box-shadow: 0 0 0 1px rgba(58, 167, 255, 0.1);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr);
      gap: 1rem;
      align-items: start;
    }

    .layout.collapsed {
      grid-template-columns: 1fr;
      justify-content: center;
    }

    .layout.collapsed .side-column {
      display: none;
    }

    .layout.collapsed .main-column {
      max-width: 960px;
      margin: 0 auto;
    }

    .main-column section:first-child,
    .side-column section:first-child {
      margin-top: 0;
    }

    .main-column,
    .side-column {
      min-width: 0;
    }

    .button-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.5rem;
    }

    .button-row button {
      width: auto;
    }

    .button-row.controls-row {
      justify-content: center;
      grid-template-columns: repeat(auto-fit, minmax(170px, 170px));
    }

    section.mfd-box {
      --mfd-gap: 0.5rem;
      --mfd-btn-py: 0.18rem;
      --mfd-btn-px: 0.4rem;
      --mfd-cutout-x: 0.45rem;
      --mfd-cutout-top: 0.6rem;
      --mfd-cutout-bottom: 0.38rem;
      --mfd-anchor-offset: -1.15rem;
      --mfd-bottom-offset: -0.5rem;
      --mfd-bottom-reserve: 0.55rem;
      position: relative;
      margin-top: 1.3rem;
      padding-top: 0.7rem;
      overflow: visible;
    }

    section.mfd-box .mfd-anchor {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: var(--mfd-gap);
      margin-top: var(--mfd-anchor-offset);
      padding: 0 0.6rem;
      position: relative;
    }

    section.mfd-box .mfd-anchor.mfd-anchor-right {
      justify-content: flex-end;
    }

    section.mfd-box :is(.mfd-anchor button, .mfd-footer-anchor button, .mfd-bottom-btn) {
      position: relative;
      z-index: 1;
      min-width: 0;
      width: auto;
      border: none;
      background: var(--bg);
      color: #ffffff;
      box-shadow: none;
      padding: var(--mfd-btn-py) var(--mfd-btn-px);
      white-space: nowrap;
      font-size: 1.05rem;
    }

    section.mfd-box .mfd-anchor button::before {
      content: "";
      position: absolute;
      left: calc(-1 * var(--mfd-cutout-x));
      right: calc(-1 * var(--mfd-cutout-x));
      top: calc(-1 * var(--mfd-cutout-top) + 0.02rem);
      height: var(--mfd-cutout-top);
      background: var(--bg);
      pointer-events: none;
    }

    section.mfd-box :is(.mfd-anchor button, .mfd-footer-anchor button, .mfd-bottom-btn):hover {
      transform: none;
      color: var(--line);
      text-shadow: 0 0 8px rgba(58, 167, 255, 0.35);
      box-shadow: none;
    }

    section.mfd-box :is(.mfd-anchor button, .mfd-footer-anchor button, .mfd-bottom-btn):active:not(:disabled) {
      background: #ffffff;
      color: #000000;
      text-shadow: none;
      box-shadow: none;
    }

    section.mfd-box :is(.mfd-anchor button, .mfd-footer-anchor button, .mfd-bottom-btn):focus-visible {
      outline: 1px solid var(--line);
      outline-offset: 2px;
    }

    section.mfd-box :is(.mfd-anchor button, .mfd-footer-anchor button, .mfd-bottom-btn):disabled,
    section.mfd-box :is(.mfd-anchor button, .mfd-footer-anchor button, .mfd-bottom-btn):disabled:hover {
      opacity: 1;
      cursor: not-allowed;
      color: #000000;
      background: #ffffff;
      text-shadow: none;
      box-shadow: none;
      transform: none;
      filter: none;
    }

    section.mfd-box .auto-export-mode-btn.is-active,
    section.mfd-box .auto-export-mode-btn.is-active:hover {
      background: #ffffff;
      color: #000000;
      text-shadow: none;
    }

    section.mfd-box .auto-export-mode-btn.is-active:active:not(:disabled) {
      background: var(--bg);
      color: var(--line);
      text-shadow: 0 0 8px rgba(58, 167, 255, 0.35);
    }

    section.mfd-box.mfd-with-bottom-btn {
      padding-bottom: var(--mfd-bottom-reserve);
    }

    section.mfd-box .mfd-footer-anchor {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: var(--mfd-gap);
      margin-top: 0.2rem;
      padding: 0 0.6rem;
      position: relative;
      z-index: 2;
      transform: translateY(1.6rem);
    }

    section.mfd-box .mfd-footer-anchor button::after {
      content: "";
      position: absolute;
      left: calc(-1 * var(--mfd-cutout-x));
      right: calc(-1 * var(--mfd-cutout-x));
      bottom: calc(-0.5 * var(--mfd-cutout-bottom) + 0.04rem);
      height: calc(0.5 * var(--mfd-cutout-bottom));
      background: var(--bg);
      pointer-events: none;
    }

    section.mfd-box .mfd-bottom-btn {
      position: absolute;
      left: 50%;
      bottom: var(--mfd-bottom-offset);
      transform: translateX(-50%);
      z-index: 2;
    }

    section.mfd-box .mfd-bottom-btn::after {
      content: "";
      position: absolute;
      left: calc(-1 * var(--mfd-cutout-x));
      right: calc(-1 * var(--mfd-cutout-x));
      bottom: calc(-1 * var(--mfd-cutout-bottom) + 0.04rem);
      height: var(--mfd-cutout-bottom);
      background: var(--bg);
      pointer-events: none;
    }

    section.mfd-box .mfd-bottom-btn:not(.mfd-bottom-btn-right):is(:hover, :active:not(:disabled), :disabled) {
      transform: translateX(-50%);
    }

    section.mfd-box .mfd-bottom-btn.mfd-bottom-btn-right {
      left: auto;
      right: 0.85rem;
      transform: none;
    }

    section.mfd-box .mfd-bottom-btn.mfd-bottom-btn-right:is(:hover, :active:not(:disabled), :disabled) {
      transform: none;
    }

    section.mfd-toolbar {
      --mfd-gap: 5rem;
    }

    .button-row.controls-row button,
    .chain button {
      width: 170px;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .heading-zero {
      margin: 0;
    }

    .heading-top-zero {
      margin-top: 0;
    }

    .spacer-sm {
      margin-bottom: 0.75rem;
    }

    .page-select {
      max-width: 240px;
    }

    .grid-start {
      align-items: start;
    }

    .status-value {
      font-family: "IBMPlexMono";
    }

    .sortable {
      min-height: 40px;
      margin: 0.5rem 0 0;
      padding: 0;
      border: 1px dashed rgba(58, 167, 255, 0.35);
      border-radius: 8px;
      list-style: none;
      font-weight: 700;
    }

    .sortable li {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid rgba(58, 167, 255, 0.12);
      color: var(--text);
      cursor: grab;
    }

    .sortable li:last-child {
      border-bottom: none;
    }

    .sortable li.dragging {
      opacity: 0.6;
      background: rgba(58, 167, 255, 0.08);
    }

    .pill-handle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border: 1px solid rgba(58, 167, 255, 0.6);
      border-radius: 4px;
      background: var(--panel-strong);
      color: #ffffff;
      font-size: 12px;
      box-shadow: 0 0 6px rgba(58, 167, 255, 0.35);
    }

    .pill-handle.page {
      background: #0f2337;
      color: #ffffff;
    }

    .pill-handle.available {
      background: #0f1e31;
      color: #ffffff;
    }

    .page-shortcuts {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin: 0 auto 0.5rem;
    }

    .page-shortcuts button {
      width: auto;
      padding: 0.35rem 0.75rem;
    }

    section.mfd-page-nav {
      --mfd-gap: 1rem;
    }

    section.mfd-page-nav .mfd-anchor {
      margin-bottom: 0.65rem;
    }

    .chain {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }

    section.mfd-flow {
      --mfd-gap: 1.65rem;
      --mfd-cutout-bottom: 0.0rem;
      --mfd-bottom-offset: -1.5rem;
      --mfd-bottom-reserve: 0.9rem;
    }

    section.mfd-flow .mfd-anchor {
      align-items: flex-start;
    }

    section.mfd-settings,
    section.mfd-theater {
      --mfd-cutout-bottom: 0.6rem;
      --mfd-bottom-reserve: 0.9rem;
      --mfd-bottom-offset: 0.6rem;
    }

    section.mfd-theater #copy_to_kto_btn {
      position: absolute;
      left: auto !important;
      right: 0.85rem !important;
      bottom: calc(var(--mfd-bottom-offset) - 1.3rem);
      transform: none !important;
      z-index: 2;
    }

    section.mfd-theater #copy_to_kto_btn::after {
      content: "";
      position: absolute;
      left: calc(-1 * var(--mfd-cutout-x));
      right: calc(-1 * var(--mfd-cutout-x));
      bottom: calc(-0.5 * var(--mfd-cutout-bottom) + 0.04rem);
      height: calc(0.5 * var(--mfd-cutout-bottom));
      background: var(--bg);
      pointer-events: none;
    }

    section.mfd-theater #copy_to_kto_btn:is(:hover, :active:not(:disabled), :disabled) {
      transform: none !important;
    }

    section.mfd-status {
      --mfd-cutout-top: 0.2rem;
    }

    .badge-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.3rem 0.6rem;
      border: 1px solid #ffffff;
      border-radius: 0px;
      background: var(--bg);
      color: #ffffff;
      font-size: 1.05rem;
      box-shadow: none;
      font-weight: 700;
    }

    .badge.ok,
    .badge.muted {
      background: var(--bg);
      color: #ffffff;
      border-color: #ffffff;
      opacity: 1;
    }

    .badge.warn,
    .badge.error {
      background: #9f1010;
      color: #ffffff;
      border-color: #ffffff;
      opacity: 1;
    }

    .badge-row #toggle-toolbar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      width: auto;
      height: 32px;
      padding: 0.25rem 0.8rem;
      border: none;
      background: var(--bg);
      color: #ffffff;
      font-size: 1.05rem;
      white-space: nowrap;
      box-shadow: none;
    }

    .badge-row #quit-app-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      width: auto;
      height: 32px;
      padding: 0.25rem 0.8rem;
      border: none;
      background: #9f1010;
      color: #ffffff;
      font-size: 1.05rem;
      white-space: nowrap;
      box-shadow: none;
    }

    .badge-row #toggle-toolbar:hover {
      color: var(--line);
      text-shadow: none;
      box-shadow: none;
      transform: none;
    }

    .badge-row #quit-app-btn:hover {
      color: #ffffff;
      background: #bf1a1a;
      text-shadow: none;
      box-shadow: none;
      transform: none;
    }

    .badge-row #toggle-toolbar:active:not(:disabled) {
      background: #ffffff;
      color: #000000;
      text-shadow: none;
      box-shadow: none;
      transform: none;
    }

    .badge-row #quit-app-btn:active:not(:disabled) {
      background: #ffffff;
      color: #9f1010;
      text-shadow: none;
      box-shadow: none;
      transform: none;
    }

    .truncate {
      display: inline-block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: help;
    }

    .settings-meta {
      margin-top: 0.65rem;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.45rem;
      font-family: "IBMPlexMono";
      font-size: 0.78rem;
      letter-spacing: 0.03em;
      opacity: 0.84;
    }

    .settings-meta a {
      text-transform: none;
      letter-spacing: inherit;
    }

    .shutdown-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      box-sizing: border-box;
      background: var(--bg);
      color: var(--text);
    }

    .shutdown-panel {
      width: min(560px, 100%);
      padding: 1.5rem 1.75rem;
      border: 1px solid #ffffff;
      background: var(--bg);
      box-shadow: var(--shadow);
    }

    .shutdown-panel h1 {
      margin: 0 0 0.75rem;
      color: #ffffff;
    }

    .shutdown-panel p {
      margin: 0;
      font-family: "IBMPlexMono";
      line-height: 1.5;
    }

    @media (max-width: 1024px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .grid.two {
        grid-template-columns: 1fr;
      }
    }

    @media print {
      .no-print {
        display: none !important;
      }

      body {
        padding: 0;
      }
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <header>
      <div>
        <h1>Falcon BMS HTML Briefing</h1>
      </div>
      <div class="badge-row">
        <button id="toggle-toolbar" type="button">Hide toolbar</button>
        <div class="badge" id="file-status" title="Briefing/callsign file changes">
          <span>FILES</span>
        </div>
        <div class="badge" id="overflow-status" title="PDF pages vs layout pages">
          <span>PDF</span>
        </div>
        <div class="badge muted" id="global-status-badge" title="Global config status">
          <span id="status-indicator">Idle</span>
        </div>
        <button id="quit-app-btn" type="button">Quit</button>
      </div>
    </header>

    <div class="layout">
      <div class="main-column">
        <section class="mfd-box mfd-toolbar no-print">
          <div class="button-row controls-row mfd-anchor">
            <button id="generate-btn-main" class="generate-brief-btn">Gen brf</button>
            <button id="save-edits-btn">Save</button>
            <button id="load-edits-btn">Load</button>
            <button id="reset-edits-btn">Reset</button>
          </div>
        </section>

        <section class="mfd-box mfd-page-nav">
          <div class="page-shortcuts mfd-anchor" id="page-shortcuts"></div>
          <iframe id="brief-frame" src="/brief" title="Briefing preview"></iframe>
        </section>

        <section class="mfd-box mfd-flow mfd-with-bottom-btn no-print">
          <div class="chain mfd-anchor">
            <button id="generate-btn-output" class="generate-brief-btn">Gen brf</button>
            <button id="pdf-btn">Gen PDF</button>
            <button id="export-btn">Export</button>
            <button id="auto-export-mode-btn" class="auto-export-mode-btn" type="button">AUTO-EXPORT<br>OFF</button>
          </div>
          <button id="open-pdf-btn" class="mfd-bottom-btn">Open PDF</button>
        </section>

        <section class="mfd-box mfd-layout">
          <div class="mfd-anchor mfd-anchor-right no-print">
            <button id="save-layout-btn" type="button">Save layout</button>
          </div>
          <div class="panel-head">
            <h3 class="heading-zero">Layout</h3>
          </div>
          <div class="spacer-sm">
            <label for="page-select">Page</label>
            <select id="page-select" class="page-select"></select>
          </div>
          <div class="grid two grid-start">
            <div>
              <label>Page sections</label>
              <ul id="section-list" class="sortable"></ul>
            </div>
            <div>
              <label>Available sections</label>
              <ul id="available-list" class="sortable"></ul>
            </div>
          </div>
        </section>

        <section>
          <h3 class="heading-top-zero">Messages</h3>
          <div id="log">Waiting...</div>
        </section>
      </div>

      <div class="side-column">
        <section id="status-card" class="mfd-box mfd-status">
          <div class="mfd-anchor mfd-anchor-right no-print">
            <button id="reload-btn" type="button" title="Reload BMS config">Reload</button>

  <script>
    const logEl = document.getElementById("log");
    const statusEl = document.getElementById("status-indicator");
    const fileBadge = document.getElementById("file-status");
    const overflowBadge = document.getElementById("overflow-status");
    const globalStatusBadge = document.getElementById("global-status-badge");
    const quitAppBtn = document.getElementById("quit-app-btn");
    const bmsSelect = document.getElementById("bms_version");
    const availableVersionsInput = document.getElementById("bms_available_versions");
    const wineInput = document.getElementById("wine_prefix");
    const layoutEl = document.querySelector(".layout");
    const toggleToolbarBtn = document.getElementById("toggle-toolbar");
    const autoExportModeBtn = document.getElementById("auto-export-mode-btn");
    const copyToKtoBtn = document.getElementById("copy_to_kto_btn");
    const pdfBtn = document.getElementById("pdf-btn");
    const exportBtn = document.getElementById("export-btn");
    const openPdfBtn = document.getElementById("open-pdf-btn");
    const generateBriefBtns = Array.from(document.querySelectorAll(".generate-brief-btn"));
    const camSaveSelect = document.getElementById("cam-save-select");
    const camRefreshBtn = document.getElementById("cam-refresh-btn");
    const camLoadBtn = document.getElementById("cam-load-btn");
    const camUnloadBtn = document.getElementById("cam-unload-btn");
    const CAM_PREVIEW_PACKAGE_SELECT_ID = "cam-support-package-select";
    const CAM_PREVIEW_PACKAGE_QUERY_ID = "cam-support-package-query";
    const CAM_SUPPORT_PACKAGE_SAVED_KEY = "cam_support_package_index_saved";
    const CAM_LAST_SAVE_PATH_KEY = "cam_last_save_path";
    const APP_INSTANCE_SEEN_KEY = "app_instance_id_seen";
    const CAM_SUPPORT_CELL_IDS = [
      "package_1", "package_2", "package_3", "package_4", "package_5", "package_6", "package_7", "package_30",
      "package_8", "package_9", "package_10", "package_11", "package_12", "package_13", "package_14", "package_31",
      "package_15", "package_16", "package_17", "package_18", "package_19", "package_21", "package_22", "package_32",
      "package_23", "package_24", "package_25", "package_26", "package_27", "package_28", "package_29", "package_33",
      "package_34", "package_35", "package_36", "package_37", "package_38", "package_39", "package_40", "package_41"
    ];
    const TOOLBAR_STATE_KEY = "toolbarCollapsed";
    const MAP_SOURCES = [
      {
        id: "local",
        label: "BMS local"
      },
      {
        id: "esri_imagery_hybrid",
        label: "Web satelite"
      }
    ];
    let lastLogId = 0;
    const LOG_MAX_LINES = 300;
    const logLines = [];
    let pages = [];
    let currentPageIndex = 0;
    let dndAttached = false;
    let selectedMapSourceId = "local";
    let draggingEl = null;
    let draggingFrom = null;
    let pdfBusy = false;
    let localPdfBusy = false;
    let serverPdfBusy = false;
    let exportBusy = false;
    let filesChangedState = false;
    let pendingAutoExport = false;
    let skipNextAutoExportEdge = false;
    let autoExportOnChange = false;
    let autoExportPdfOnly = false;
    let copyToKtoEnabled = false;
    let hasSeenStatusSuccess = false;
    let shutdownScreenShown = false;
    let logPollTimer = null;
    let statusPollTimer = null;
    const sectionLabels = {
      airbase: "Airbase",
      package: "Package",
      flightplan: "Flight plan",
      roster: "Roster",
      admin: "Admin",
      weapon_settings: "Weapon settings",
      cmds: "CMDs",
      targets: "Targets",
      delivery: "Delivery",
      aa_brevity_notes: "AA - Brevity - Notes",
      support: "Support",
      weapons: "Weapons",
      tgtsteerpoints: "Target steerpoints",
      wpn_targets: "Weapon targets",
      roe: "ROE",
      weather: "Weather",
      map: "Map",
      comms: "Comms",
      custom_checklist: "Custom checklist",
    };
    const allSections = Object.keys(sectionLabels);
    function log(message) {
      const ts = new Date().toLocaleTimeString();
      if (!logEl) return;
      logLines.unshift(`[${ts}] ${message}`);
      if (logLines.length > LOG_MAX_LINES) {
        logLines.length = LOG_MAX_LINES;
      }
      logEl.textContent = logLines.join("\n");
    }

    function debugLog(message) {
      if (typeof console !== "undefined" && typeof console.debug === "function") {
        console.debug(message);
      }
    }

    async function withActiveLogPolling(taskPromise) {
      let done = false;
      const activePoll = setInterval(() => {
        if (!done) pollLogs();
      }, 750);
      try {
        return await taskPromise;
      } finally {
        done = true;
        clearInterval(activePoll);
        await pollLogs();
      }
    }

    function updateCamSummaryUi(camData, outputPath = null) {
      if (camSaveSelect) {
        camSaveSelect.title = camData && outputPath ? `CAM parsed: ${outputPath}` : "";
      }
      if (camUnloadBtn) camUnloadBtn.disabled = !camData;
    }

    function clearTransientAppStateOnInstanceChange(appInstanceId) {
      if (typeof appInstanceId !== "string" || !appInstanceId) return;
      let previousInstanceId = "";
      try {
        previousInstanceId = localStorage.getItem(APP_INSTANCE_SEEN_KEY) || "";
      } catch {
        previousInstanceId = "";
      }
      if (!previousInstanceId) {
        try {
          localStorage.setItem(APP_INSTANCE_SEEN_KEY, appInstanceId);
        } catch {
          // Keep behavior even if localStorage is unavailable.
        }
        return;
      }
      if (previousInstanceId === appInstanceId) {
        return;
      }
      try {
        localStorage.removeItem("contenteditables");
        localStorage.removeItem("contenteditablesDef");
        localStorage.removeItem("onrefresh");
        localStorage.removeItem(CAM_SUPPORT_PACKAGE_SAVED_KEY);
        localStorage.removeItem(CAM_LAST_SAVE_PATH_KEY);
        localStorage.setItem(APP_INSTANCE_SEEN_KEY, appInstanceId);
      } catch {
        // Keep behavior even if localStorage is unavailable.
      }
    }

    function getSavedCamSupportPackageIndex() {
      const raw = localStorage.getItem(CAM_SUPPORT_PACKAGE_SAVED_KEY);
      const parsed = Number.parseInt(String(raw ?? ""), 10);
      if (!Number.isFinite(parsed) || parsed < 0) return null;
      return parsed;
    }

    function saveCamSupportPackageIndex(index) {
      if (!Number.isFinite(index) || index < 0) {
        localStorage.removeItem(CAM_SUPPORT_PACKAGE_SAVED_KEY);
        return;
      }
      localStorage.setItem(CAM_SUPPORT_PACKAGE_SAVED_KEY, String(index));
    }

    function saveCurrentCamSupportPackageSelection() {
      saveCamSupportPackageIndex(getSelectedCamPackageIndex());
    }

    function getPreviewCamPackageSelect() {
      const cw = briefFrame?.contentWindow;
      if (!cw || !cw.document) return null;
      return cw.document.getElementById(CAM_PREVIEW_PACKAGE_SELECT_ID);
    }

    function getPreviewCamPackageQuery() {
      const cw = briefFrame?.contentWindow;
      if (!cw || !cw.document) return null;
      return cw.document.getElementById(CAM_PREVIEW_PACKAGE_QUERY_ID);
    }

    function clearSavedCamRenderedValues({ clearBullseye = false, clearSupportPackage = false } = {}) {
      const saved = getSavedEdits();
      if (clearBullseye) {
        delete saved.bullseyePos;
      }
      if (clearSupportPackage) {
        CAM_SUPPORT_CELL_IDS.forEach((id) => {
          delete saved[id];
        });
      }
      Object.keys(saved).forEach((key) => {
        if (key.startsWith("package_main_l16_")) {
          delete saved[key];
        }
      });
      localStorage.setItem("contenteditables", JSON.stringify(saved));
    }

    function rebuildPreviewCamPackageOptions(select, options, selectedValue, queryText) {
      if (!select) return;
      select.innerHTML = "";
      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = options.length ? "Select package" : "No matching packages";
      select.appendChild(placeholder);
      options.forEach((optionData) => {
        const option = document.createElement("option");
        option.value = optionData.value;
        option.textContent = optionData.label;
        option.dataset.search = optionData.search;
        select.appendChild(option);
      });
      if (selectedValue && options.some((option) => option.value === selectedValue)) {
        select.value = selectedValue;
      } else if (queryText && options.length === 1) {
        select.value = options[0].value;
      } else {
        select.value = "";
      }
      select.disabled = options.length === 0;
    }

    async function applySelectedCamPackageFromPreview() {
      const selected = getSelectedCamPackageIndex();
      if (!Number.isFinite(selected)) return false;
      clearSavedCamRenderedValues({ clearSupportPackage: true });
      saveCamSupportPackageIndex(selected);
      await doPreview(currentOverrides());
      return true;
    }

    function bindCamPackageSelectorInPreview() {
      const select = getPreviewCamPackageSelect();
      const query = getPreviewCamPackageQuery();
      if (!select) return false;
      if (select.dataset.camBound === "1") return true;
      select._camOptions = Array.from(select.querySelectorAll("option"))
        .filter((option) => option.value !== "")
        .map((option) => ({
          value: option.value,
          label: option.textContent || "",
          search: (option.dataset.search || option.textContent || "").toLowerCase(),
        }));
      select.dataset.camBound = "1";
      select.addEventListener("change", async () => {
        await applySelectedCamPackageFromPreview();
      });
      if (query && query.dataset.camBound !== "1") {
        query.dataset.camBound = "1";
        query.addEventListener("input", async () => {
          const sourceOptions = Array.isArray(select._camOptions) ? select._camOptions : [];
          const previousValue = select.value;
          const queryText = (query.value || "").trim().toLowerCase();
          const visibleOptions = queryText
            ? sourceOptions.filter((option) => option.search.includes(queryText))
            : sourceOptions;
          rebuildPreviewCamPackageOptions(select, visibleOptions, previousValue, queryText);
          if (queryText && visibleOptions.length === 1 && select.value !== previousValue) {
            await applySelectedCamPackageFromPreview();
          }
        });
      }
      return true;
    }

    function getSelectedCamPackageIndex() {
      const select = getPreviewCamPackageSelect();
      if (!select) {
        const saved = getSavedCamSupportPackageIndex();
        return Number.isFinite(saved) ? saved : null;
      }
      const parsed = Number.parseInt(select.value, 10);
      if (!Number.isFinite(parsed) || parsed < 0) return null;
      return parsed;
    }

    function applyAutoExportMode(onChange, pdfOnly) {
      autoExportOnChange = !!onChange;
      autoExportPdfOnly = !!(onChange && pdfOnly);
      if (!autoExportModeBtn) return;
      autoExportModeBtn.classList.toggle("is-active", autoExportOnChange);
      let stateLabel = "OFF";
      if (!autoExportOnChange) {
        autoExportModeBtn.title = "Auto-export disabled";
      } else if (autoExportPdfOnly) {
        stateLabel = "PDF ONLY";
        autoExportModeBtn.title = "Auto-export enabled: PDF only";
      } else {
        stateLabel = "ON";
        autoExportModeBtn.title = "Auto-export enabled";
      }
      autoExportModeBtn.innerHTML = `AUTO-EXPORT<br>${stateLabel}`;
    }

    function getAutoExportModeIndex() {
      if (!autoExportOnChange) return 0;
      return autoExportPdfOnly ? 2 : 1;
    }

    function applyCopyToKtoMode(enabled) {
      copyToKtoEnabled = !!enabled;
      if (!copyToKtoBtn) return;
      copyToKtoBtn.classList.toggle("is-active", copyToKtoEnabled);
      copyToKtoBtn.innerHTML = `COPY TO KTO<br>${copyToKtoEnabled ? "ON" : "OFF"}`;
      copyToKtoBtn.title = copyToKtoEnabled ? "Copy to KTO enabled" : "Copy to KTO disabled";
    }

    async function fetchJSON(url, options = {}) {
      const res = await fetch(url, { headers: { "Content-Type": "application/json" }, ...options });
      if (!res.ok) {
        const detail = await res.text();
        throw new Error(detail || `${res.status} ${res.statusText}`);
      }
      return res.json();
    }

    function updateBadges({ briefChanged, callsignChanged, pdfOverflow }) {
      if (fileBadge) {
        fileBadge.classList.remove("ok", "error", "warn", "muted");
        let cls = "ok";
        if (briefChanged || callsignChanged) cls = "error";
        if (briefChanged === undefined || briefChanged === null) cls = "muted";
        fileBadge.classList.add(cls);
        fileBadge.title = "Briefing/callsign unchanged";
        if (cls === "error") fileBadge.title = "Briefing.txt or callsign.ini changed on disk";
        if (cls === "muted") fileBadge.title = "File change status unknown (generate/preview once)";
      }
      if (overflowBadge) {
        overflowBadge.classList.remove("ok", "error", "warn", "muted");
        let cls = "ok";
        if (pdfOverflow === true) cls = "warn";
        if (pdfOverflow === undefined || pdfOverflow === null) cls = "muted";
        overflowBadge.classList.add(cls);
        overflowBadge.title = cls === "warn" ? "PDF has more pages than layout" : (cls === "ok" ? "PDF matches layout page count" : "PDF status unknown (generate PDF once)");
      }
    }

    function showShutdownScreen() {
      if (shutdownScreenShown) return;
      shutdownScreenShown = true;
      if (logPollTimer) {
        clearInterval(logPollTimer);
        logPollTimer = null;
      }
      if (statusPollTimer) {
        clearInterval(statusPollTimer);
        statusPollTimer = null;
      }
      document.body.innerHTML = `
        <div class="shutdown-screen">
          <div class="shutdown-panel">
            <h1>Application Stopped</h1>
            <p>The HTML Briefing server has been shut down. You can close this tab.</p>
          </div>
        </div>
      `;
      document.title = "Application Stopped";
    }

    function populateVersionSelect(available, current) {
      const opts = (available || "").split(",").map(v => v.trim()).filter(Boolean);
      bmsSelect.innerHTML = "";
      if (opts.length === 0) {
        const o = document.createElement("option");
        o.value = current || "";
        o.textContent = current || "Set a version";
        bmsSelect.appendChild(o);
        return;
      }
      opts.forEach(v => {
        const o = document.createElement("option");
        o.value = v;
        o.textContent = v;
        bmsSelect.appendChild(o);
      });
      bmsSelect.value = current || opts[0];
    }

    function getMapSourceById(id) {
      return MAP_SOURCES.find((source) => source.id === id) || MAP_SOURCES[0];
    }

    function detectMapSource(sys) {
      const mapId = String(sys.map || "").trim().toLowerCase().replace("-", "_");
      return getMapSourceById(mapId).id;
    }

    function setSelectedMapSource(id) {
      selectedMapSourceId = getMapSourceById(id).id;
    }

    function selectedMapSystemOverrides() {
      const selected = getMapSourceById(selectedMapSourceId);
      return { map: selected.id };
    }

    async function loadConfig() {
      try {
        const data = await fetchJSON("/api/config");
        const cfg = data.bms || {};
        const sys = data.system || {};
        availableVersionsInput.value = cfg.bms_available_versions || "";
        populateVersionSelect(cfg.bms_available_versions, cfg.bms_version);
        document.getElementById("default_airframe").value = cfg.default_airframe || "F-16";
        wineInput.value = sys.wine_prefix || "";
        document.getElementById("output_dir").value = sys.output_dir || "";
        document.getElementById("pdf_output_dir").value = sys.pdf_output_dir || "";
        setSelectedMapSource(detectMapSource(sys));
        applyAutoExportMode(
          String(sys.auto_export_on_change || "False").toLowerCase() === "true",
          String(sys.auto_export_pdf_only || "False").toLowerCase() === "true"
        );
        await loadTheater();
      } catch (err) {
        log(`Failed to load config: ${err.message}`);
      }
    }

    function applyStatusData(data) {
      clearTransientAppStateOnInstanceChange(data.app_instance_id);
      hasSeenStatusSuccess = true;
      document.getElementById("config-path").textContent = data.config_path || "–";
      document.getElementById("config-path").title = data.config_path || "–";
      document.getElementById("base-dir").textContent = data.base_dir || "–";
      document.getElementById("base-dir").title = data.base_dir || "–";
      document.getElementById("theater").textContent = data.theater || "–";
      document.getElementById("callsign").textContent = data.callsign || "–";
      document.getElementById("target-folder").textContent = data.target_folder || "–";
      document.getElementById("target-folder").title = data.target_folder || "–";
      document.getElementById("pdf-dir-status").textContent = data.pdf_output_dir || "–";
      document.getElementById("pdf-dir-status").title = data.pdf_output_dir || "–";
      setServerPdfBusy(!!data.pdf_busy);
      updateCamSummaryUi(data.cam_loaded ? {} : null, data.cam_output_file || null);
      const hasError = data.error || !data.base_dir;
      statusEl.textContent = hasError ? "BMS CONFIG MISSING" : "READY";
      if (globalStatusBadge) {
        globalStatusBadge.classList.remove("ok", "error", "warn", "muted");
        globalStatusBadge.classList.add(hasError ? "error" : "ok");
      }
      updateBadges({
        briefChanged: data.brief_changed,
        callsignChanged: data.callsign_changed,
        pdfOverflow: data.pdf_overflow
      });
      return { hasError };
    }

    async function loadStatus(allowRetry = true) {
      try {
        const data = await fetchJSON("/api/status");
        const { hasError } = applyStatusData(data);
        await maybeAutoExportOnFileChange(data);
        pages = Array.isArray(data.pages) ? data.pages : [];
        renderPages();
        await loadTheater();
        await refreshCamSaveList(true);
        if (!hasError && pages.length > 0) {
          await doPreview(currentOverrides());
        }
        if (hasError && allowRetry) {
          await fetchJSON("/api/reload", { method: "POST" });
          await loadStatus(false);
        }
      } catch (err) {
        if (hasSeenStatusSuccess) {
          showShutdownScreen();
          return;
        }
        log(`Failed to load status: ${err.message}`);
        if (allowRetry) {
          try {
            await fetchJSON("/api/reload", { method: "POST" });
            await loadStatus(false);
          } catch (e) {
            log(`Reload failed: ${e.message}`);
          }
        }
      }
    }

    async function pollStatusBadges() {
      try {
        const data = await fetchJSON("/api/status");
        applyStatusData(data);
        await maybeAutoExportOnFileChange(data);
      } catch (err) {
        if (hasSeenStatusSuccess) {
          showShutdownScreen();
        }
      }
    }

    document.getElementById("config-form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const payload = { bms: {}, system: {}, pages: buildPagesObj() };
      payload.bms.bms_version = bmsSelect.value;
      payload.bms.bms_available_versions = availableVersionsInput.value;
      payload.bms.default_airframe = document.getElementById("default_airframe").value;
      payload.system.wine_prefix = wineInput.value;
      payload.system.output_dir = document.getElementById("output_dir").value;
      payload.system.pdf_output_dir = document.getElementById("pdf_output_dir").value;
      payload.system.auto_export_on_change = autoExportOnChange ? "True" : "False";
      payload.system.auto_export_pdf_only = autoExportPdfOnly ? "True" : "False";
      Object.assign(payload.system, selectedMapSystemOverrides());
      try {
        await fetchJSON("/api/config", { method: "POST", body: JSON.stringify(payload) });
        log("Config saved");
        await loadStatus();
      } catch (err) {
        log(`Save failed: ${err.message}`);
      }
    });

    document.getElementById("reload-btn").addEventListener("click", async () => {
      try {
        await fetchJSON("/api/cam/unload", { method: "POST" });
        resetSavedCamSelection();
        await fetchJSON("/api/reload", { method: "POST" });
        log("Reloaded BMS config");
        await loadStatus();
      } catch (err) {
        log(`Reload failed: ${err.message}`);
      }
    });

    if (quitAppBtn) {
      quitAppBtn.addEventListener("click", async () => {
        quitAppBtn.disabled = true;
        try {
          await fetchJSON("/api/quit", { method: "POST" });
          showShutdownScreen();

    function formatCamSaveLabel(save) {
      if (!save || typeof save !== "object") return "";
      const name = typeof save.name === "string" ? save.name : "";
      const mtime = Number(save.mtime);
      if (!name) return "";
      if (!Number.isFinite(mtime)) return name;
      return `${name} (${new Date(mtime * 1000).toLocaleString()})`;
    }

    function populateCamSaveSelect(saves) {
      if (!camSaveSelect) return;
      const previousValue = camSaveSelect.value || "";
      let storedValue = "";
      try {
        storedValue = localStorage.getItem(CAM_LAST_SAVE_PATH_KEY) || "";
      } catch {
        storedValue = "";
      }
      camSaveSelect.innerHTML = "";
      if (!Array.isArray(saves) || saves.length === 0) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "No saves found";
        camSaveSelect.appendChild(option);
        camSaveSelect.disabled = true;
        if (camLoadBtn) camLoadBtn.disabled = true;
        updateBusyUi();
        return;
      }

      let optionCount = 0;
      saves.forEach((save) => {
        if (!save || typeof save.path !== "string" || !save.path) return;
        const option = document.createElement("option");
        option.value = save.path;
        option.textContent = formatCamSaveLabel(save) || save.path;
        option.title = save.path;
        camSaveSelect.appendChild(option);
        optionCount += 1;
      });
      if (!optionCount) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "No saves found";
        camSaveSelect.appendChild(option);
        camSaveSelect.disabled = true;
        if (camLoadBtn) camLoadBtn.disabled = true;
        updateBusyUi();
        return;
      }

      camSaveSelect.disabled = false;
      if (camLoadBtn) camLoadBtn.disabled = false;
      const hasPrevious = Array.from(camSaveSelect.options).some((option) => option.value === previousValue);
      const hasStored = !!storedValue && Array.from(camSaveSelect.options).some((option) => option.value === storedValue);
      if (hasPrevious) {
        camSaveSelect.value = previousValue;
      } else if (hasStored) {
        camSaveSelect.value = storedValue;
      } else {
        camSaveSelect.selectedIndex = 0;
      }
      updateBusyUi();
    }

    function getSavedEdits() {
      try {
        return JSON.parse(localStorage.getItem("contenteditables") || "{}");
      } catch {
        return {};
      }
    }

    function getLatestEdits() {
      const started = performance.now();
      let dataFromFrame = null;
      const cw = briefFrame?.contentWindow;
      if (cw && typeof cw.saveChangedData === "function") {
        try {
          const data = cw.saveChangedData();
          if (data && typeof data === "object" && !Array.isArray(data)) {
            dataFromFrame = data;
          }
        } catch (err) {
          log(`saveChangedData failed: ${err.message}`);
        }
      }
      const saved = getSavedEdits();
      const merged = dataFromFrame && typeof dataFromFrame === "object"
        ? { ...saved, ...dataFromFrame }
        : saved;
      try {
        const keys = merged && typeof merged === "object" ? Object.keys(merged) : [];
        const mapImage = merged && typeof merged.map_image === "string" ? merged.map_image : "";
        debugLog(`PDF prep: getLatestEdits keys=${keys.length} map_image_len=${mapImage.length} elapsed_ms=${(performance.now() - started).toFixed(1)}`);
      } catch {}
      if (dataFromFrame && typeof dataFromFrame === "object") {
        return merged;
      }
      return merged;
    }

    function buildPagesObj() {
      const pagesObj = {};
      pages.forEach((p, idx) => {
        pagesObj[`page${idx + 1}`] = (p || []).join(", ");
      });
      return pagesObj;
    }

    function layoutIncludesMap() {
      return Array.isArray(pages) && pages.some((page) => Array.isArray(page) && page.includes("map"));
    }

    async function captureMapImage() {
      if (!layoutIncludesMap()) return null;
      const frame = document.getElementById("brief-frame");
      const cw = frame?.contentWindow;
      if (!cw || typeof cw.exportMapImage !== "function") {
        throw new Error("Map capture unavailable: preview frame is not ready");
      }
      const started = performance.now();
      debugLog("PDF prep: map capture start");
      try {
        const dataUrl = await cw.exportMapImage();
        if (!dataUrl) {
          const err = cw.exportMapLastError || "unknown";
          const logTrail = Array.isArray(cw.exportMapLog) ? cw.exportMapLog.join(" | ") : "";
          throw new Error(`Map capture failed: ${err}${logTrail ? `. Trace: ${logTrail}` : ""}`);
        } else {
          debugLog(`PDF prep: map capture done len=${dataUrl.length} elapsed_ms=${(performance.now() - started).toFixed(1)}`);
        }
        return dataUrl;
      } catch (err) {
        throw new Error(`Map capture failed after ${(performance.now() - started).toFixed(1)}ms: ${err && err.message ? err.message : err}`);
      }
    }

    function updateBusyUi() {

    async function runPdfGeneration({ source = "manual", overrides = null, includeTheater = false, started = performance.now() } = {}) {
      const activeOverrides = overrides || currentOverrides();
      const payload = { content: getLatestEdits(), ...activeOverrides };
      const mapImage = await captureMapImage();
      if (mapImage) {
        payload.content.map_image = mapImage;
      }
      if (includeTheater) {
        payload.theater = {
          copy_to_kto: copyToKtoEnabled
        };
      }
      try {
        const payloadSize = JSON.stringify(payload).length;
        debugLog(`PDF request: source=${source} selected_package_index=${payload.selected_package_index} payload_size=${payloadSize} map_image_len=${typeof payload.content?.map_image === "string" ? payload.content.map_image.length : 0}`);
      } catch (err) {
        debugLog(`PDF request: failed to measure payload size: ${err.message}`);
      }
      debugLog("PDF request: POST /api/pdf start");
      const pdfRes = await fetchJSON("/api/pdf", { method: "POST", body: JSON.stringify(payload) });
      debugLog(`PDF request: POST /api/pdf done elapsed_ms=${(performance.now() - started).toFixed(1)}`);
      log(`PDF generated at ${pdfRes.pdf_file}`);
      return { pdfRes, payload, overrides: activeOverrides };
    }

    async function runExportFlow(source = "manual") {
      if (pdfBusy || exportBusy) return;
      setPdfBusy(true);
      setExportBusy(true);
      const started = performance.now();
      try {
        const overrides = currentOverrides();
        const pdfOnlyAuto = source === "auto" && autoExportPdfOnly;
        if (source === "auto") {
          try {
            const prevRes = await fetchJSON("/api/preview", { method: "POST", body: JSON.stringify(overrides) });
            log(`Auto-export preview refreshed at ${prevRes.output_file}`);
            await refreshBrief(true);
          } catch (err) {
            log(`Auto-export preview refresh failed: ${err.message}`);
          }
        }
        const { payload } = await runPdfGeneration({
          source,
          overrides,
          includeTheater: true,
          started
        });
        if (!pdfOnlyAuto) {
          const expRes = await fetchJSON("/api/export", { method: "POST", body: JSON.stringify({ ...overrides, theater: payload.theater }) });
          log(`Exported kneeboards to ${expRes.target_folder}`);
        } else {
          log("Auto-export PDF-only mode: skipped DDS kneeboard export");
        }
        if (source === "auto") {
          log("Auto-export completed");
        }
        if (source === "manual") {
          skipNextAutoExportEdge = true;
        }
        await pollStatusBadges();
      } catch (err) {
        const prefix = source === "auto" ? "Auto-export failed" : "Export failed";
        log(`${prefix} after ${(performance.now() - started).toFixed(1)}ms: ${err.message}`);
      } finally {
        setExportBusy(false);
        setPdfBusy(false);
      }
    }

    async function maybeAutoExportOnFileChange(data) {
      const filesChangedNow = !!(data.brief_changed || data.callsign_changed);
      if (skipNextAutoExportEdge && !filesChangedNow) {
        skipNextAutoExportEdge = false;
      }
      const changeEdge = filesChangedNow && !filesChangedState;
      if (changeEdge && (pdfBusy || exportBusy)) {
        pendingAutoExport = true;
      }
      filesChangedState = filesChangedNow;
      if (!changeEdge && !pendingAutoExport) return;
      if (pendingAutoExport && !filesChangedNow) {
        pendingAutoExport = false;
        return;
      }
      if (skipNextAutoExportEdge) {
        skipNextAutoExportEdge = false;
        return;
      }
      if (!autoExportOnChange) {
        pendingAutoExport = false;
        return;
      }
      if (pdfBusy || exportBusy) return;
      pendingAutoExport = false;
      const pdfOnlyAuto = autoExportPdfOnly;
      log(`File change detected. Running auto-export${pdfOnlyAuto ? " (PDF only)" : ""}.`);
      await runExportFlow("auto");
    }

    function getFrameScroll(frame) {
      try {
        const win = frame.contentWindow;
        if (!win || !win.document) return 0;
        return win.scrollY || win.document.documentElement.scrollTop || win.document.body.scrollTop || 0;
      } catch {
        return 0;
      }
    }

    function refreshBrief(waitForLoad = false) {
      const frame = document.getElementById("brief-frame");
      if (!frame) return waitForLoad ? Promise.resolve(false) : undefined;
      const prevScroll = getFrameScroll(frame);
      let resolveLoad = null;
      let timeoutId = null;
      const loadPromise = waitForLoad ? new Promise((resolve) => { resolveLoad = resolve; }) : null;
      frame.addEventListener("load", function handleLoad() {
        frame.removeEventListener("load", handleLoad);
        if (timeoutId) {
          clearTimeout(timeoutId);
        }
        requestAnimationFrame(() => {
          try {
            frame.contentWindow?.scrollTo(0, prevScroll);
          } catch {
            /* ignore */
          }
          if (resolveLoad) {
            // Give inner scripts a frame to settle (map rendering/readbacks).
            requestAnimationFrame(() => resolveLoad(true));
          }
        });
      });
      if (resolveLoad) {
        timeoutId = setTimeout(() => resolveLoad(false), 6000);
      }
      frame.src = "/brief?ts=" + Date.now();
      return loadPromise;
    }

    async function pollLogs() {
      try {
        const entries = await fetchJSON("/api/logs");
        entries.filter(e => e.id > lastLogId).forEach(e => {
          lastLogId = Math.max(lastLogId, e.id);
          log(`[${e.level}] ${e.msg}`);
        });
      } catch (err) {
        // Keep quiet on errors to avoid log spam
      }
    }

        const tMap = document.getElementById("map_file_field");
        if (tName) tName.value = data.theater || "";
        if (tTarget) tTarget.value = data.target_folder || "";
        if (tMap) tMap.value = data.map_file || "";
        applyCopyToKtoMode(!!data.copy_to_kto);
        if (runPreview) {
          await doPreview(currentOverrides());

      } catch (err) {
        log(`Failed to load theater: ${err.message}`);

    function renderPages() {
      const pageSelect = document.getElementById("page-select");
      const list = document.getElementById("section-list");
      const availableList = document.getElementById("available-list");
      const shortcutBar = document.getElementById("page-shortcuts");
      if (!pageSelect || !list || !availableList) return;
      pageSelect.innerHTML = "";
      list.innerHTML = "";
      availableList.innerHTML = "";
      if (shortcutBar) shortcutBar.innerHTML = "";
      if (!pages || pages.length === 0) return;

      pages.forEach((p, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        opt.textContent = `Page ${idx + 1}`;
        pageSelect.appendChild(opt);
        if (shortcutBar) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = `Page ${idx + 1}`;
          btn.addEventListener("click", () => scrollToPage(idx + 1));
          shortcutBar.appendChild(btn);
        }
      });
      if (currentPageIndex >= pages.length) currentPageIndex = 0;
      pageSelect.value = currentPageIndex;

      const used = new Set(pages.flat().filter(Boolean));
      const availableSections = allSections.filter((s) => !used.has(s));

      availableSections.forEach((section) => {
        const li = document.createElement("li");
        li.draggable = true;
        li.dataset.section = section;
        li.innerHTML = `<span class="pill-handle available">+</span><span>${sectionLabels[section] || section}</span>`;
        availableList.appendChild(li);
      });

      const currentSections = pages[currentPageIndex] || [];
      currentSections.forEach((section) => {
        const li = document.createElement("li");
        li.draggable = true;
        li.dataset.section = section;
        li.innerHTML = `<span class="pill-handle page">⇅</span><span>${sectionLabels[section] || section}</span>`;
        list.appendChild(li);
      });
      attachDnD();
    }

    function getAfterElement(list, y) {
      const elements = [...list.querySelectorAll("li:not(.dragging)")];
      return elements.find((el) => {
        const box = el.getBoundingClientRect();
        return y < box.top + box.height / 2;
      });
    }
    function attachDnD() {
      if (dndAttached) return;
      dndAttached = true;
      const availableList = document.getElementById("available-list");
      const sectionList = document.getElementById("section-list");
      [availableList, sectionList].forEach((list) => {
        list.addEventListener("dragstart", (e) => {
          const li = e.target.closest("li");
          if (!li) return;
          draggingEl = li;
          draggingFrom = list.id;
          li.classList.add("dragging");
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", li.dataset.section);
        });
        list.addEventListener("dragend", () => {
          if (draggingEl) draggingEl.classList.remove("dragging");
          draggingEl = null;
          draggingFrom = null;
        });
        list.addEventListener("dragover", (e) => {
          e.preventDefault();
          if (!draggingEl) return;
          const after = getAfterElement(list, e.clientY);
          if (after == null) {
            list.appendChild(draggingEl);
          } else {
            list.insertBefore(draggingEl, after);
          }
        });
        list.addEventListener("drop", (e) => {
          e.preventDefault();
          const section = e.dataTransfer.getData("text/plain");
          if (!section) return;
          if (list.id === "section-list") {
            const exists = Array.from(list.children).some((child) => child !== draggingEl && child.dataset.section === section);
            if (exists) {
              document.getElementById("available-list").appendChild(draggingEl);
              draggingEl = null;
              return;
            }
          }
          const movedFromPage = draggingFrom === "section-list" && list.id !== "section-list";
          draggingEl = null;
          draggingFrom = null;
          if (list.id === "section-list" || movedFromPage) {
            persistPages(true).then(() => renderPages());
          }
        });
      });
    }

    const pageSelectEl = document.getElementById("page-select");
    if (pageSelectEl) {
      pageSelectEl.addEventListener("change", (e) => {
        currentPageIndex = parseInt(e.target.value, 10) || 0;
        renderPages();
      });
    }

    const saveTheaterBtn = document.getElementById("save_theater_btn");
    if (copyToKtoBtn) {
      copyToKtoBtn.addEventListener("click", () => {
        applyCopyToKtoMode(!copyToKtoEnabled);
      });
    }
    if (saveTheaterBtn) {
      saveTheaterBtn.addEventListener("click", async () => {
        const payload = {
          target_folder: document.getElementById("target_folder_field").value,
          map_file: document.getElementById("map_file_field").value,
          copy_to_kto: copyToKtoEnabled
        };
        try {
          await fetchJSON("/api/theater", { method: "POST", body: JSON.stringify(payload) });
          log("Theater settings saved");
          await loadTheater(true);
          await refreshCamSaveList(false);
        } catch (err) {
          log(`Save theater failed: ${err.message}`);
        }
      });
    }

    async function persistPages(autoGenerate = false) {
      const list = document.getElementById("section-list");
      if (!list) return;
      const newOrder = Array.from(list.children).map((li) => li.dataset.section);
      pages[currentPageIndex] = newOrder;
      const pagesObj = buildPagesObj();
      if (autoGenerate) {
        const overrides = currentOverrides();
        overrides.pages = pagesObj;
        await doPreview(overrides);
        return;
      }
      try {
        await fetchJSON("/api/config", { method: "POST", body: JSON.stringify({ pages: pagesObj }) });
        log("Layout saved");
        await loadStatus();
      } catch (err) {
        log(`Save layout failed: ${err.message}`);
      }
    }

    const saveLayoutBtn = document.getElementById("save-layout-btn");
    if (saveLayoutBtn) {
      saveLayoutBtn.addEventListener("click", async () => {
        await persistPages(false);
      });
    }

    if (autoExportModeBtn) {
      autoExportModeBtn.addEventListener("click", async () => {
        const prevOn = autoExportOnChange;
        const prevPdfOnly = autoExportPdfOnly;
        const nextMode = (getAutoExportModeIndex() + 1) % 3;
        const nextOn = nextMode !== 0;
        const nextPdfOnly = nextMode === 2;
        applyAutoExportMode(nextOn, nextPdfOnly);
        try {
          await fetchJSON("/api/config/runtime", {
            method: "POST",
            body: JSON.stringify({
              system: {
                auto_export_on_change: nextOn ? "True" : "False",
                auto_export_pdf_only: nextPdfOnly ? "True" : "False"
              }
            })
          });
          if (!nextOn) {
            log("Auto-export disabled");
          } else if (nextPdfOnly) {
            log("Auto-export enabled (PDF only)");
          } else {
            log("Auto-export enabled");
          }
        } catch (err) {
          applyAutoExportMode(prevOn, prevPdfOnly);
          log(`Failed to save auto-export setting: ${err.message}`);
        }
      });
    }

    async function initializeUi() {
      log("Loading configuration...");
      logPollTimer = setInterval(pollLogs, 1000);
      await loadConfig();
      log("Loading status and generating initial preview if needed...");
      await loadStatus();
      await pollLogs();
      await pollStatusBadges();
      clearInterval(logPollTimer);
      logPollTimer = setInterval(pollLogs, 2500);
      statusPollTimer = setInterval(pollStatusBadges, 5000);
    }

    initializeUi();
  </script>
</body>
</html>
