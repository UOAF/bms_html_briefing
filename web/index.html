<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Falcon BMS Briefing Server</title>
  <link rel="icon" type="image/png" href="/assets/icon.png">
  <style>
    @font-face {
      font-family: "IBMPlexMono";
      src: url("/assets/fonts/IBM_Plex_Mono/IBMPlexMono-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "IBMPlexMono";
      src: url("/assets/fonts/IBM_Plex_Mono/IBMPlexMono-Italic.ttf") format("truetype");
      font-weight: 400;
      font-style: italic;
    }
    @font-face {
      font-family: "IBMPlexMono";
      src: url("/assets/fonts/IBM_Plex_Mono/IBMPlexMono-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: "IBMPlexMono";
      src: url("/assets/fonts/IBM_Plex_Mono/IBMPlexMono-BoldItalic.ttf") format("truetype");
      font-weight: 700;
      font-style: italic;
    }

    @font-face {
      font-family: "Viper";
      src: url("/assets/fonts/viper-display/ViperDisplay-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: "Viper";
      src: url("/assets/fonts/viper-display/ViperDisplay-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
    }

    :root {
      color-scheme: dark;
      --bg: #000000;
      --panel-strong: #15273d;
      --text: #d8e7f5;
      --line: #3aa7ff;
      --input: #0c1829;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      font-family: "Viper";
      background: var(--bg);
      color: var(--text);
    }

    body {
      margin: 0;
      padding: 0 1.25rem 2rem;
      background:
        var(--bg);
    }

    .page-wrap {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 1.25rem 0 0.75rem;
    }

    h1 {
      margin: 0;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--line);
      text-transform: uppercase;
    }

    h3 {
      text-transform: uppercase;
    }

    small {
      letter-spacing: 0.08em;
    }

    section {
      margin-top: 1rem;
      padding: 1rem 1.25rem;
      border: 1px solid rgb(255, 255, 255);
      border-radius: 0;
      background: var(--bg);
      box-shadow: var(--shadow);
    }

    label {
      display: block;
      margin-bottom: 0.35rem;
      color: var(--line);
      font-weight: 700;
      font-size: 0.88rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    input:not([type="checkbox"]),
    select {
      box-sizing: border-box;
      width: 100%;
      padding: 0.52rem 0.65rem;
      border: 1px solid #ffffff;
      border-radius: 0;
      background: var(--bg);
      color: #ffffff;
      font-family: "IBMPlexMono";
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      transition: border-color 120ms ease, box-shadow 120ms ease, color 120ms ease;
    }

    input:not([type="checkbox"])::placeholder {
      color: rgba(255, 255, 255, 0.56);
    }

    input:not([type="checkbox"]):focus,
    select:focus {
      outline: none;
      border-color: var(--line);
      box-shadow: inset 0 0 0 1px rgba(58, 167, 255, 0.45);
    }

    input:not([type="checkbox"])[readonly] {
      color: rgba(255, 255, 255, 0.82);
      border-color: rgba(255, 255, 255, 0.72);
    }

    select {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      padding-right: 1.9rem;
      background-image:
        linear-gradient(45deg, transparent 50%, #ffffff 50%),
        linear-gradient(135deg, #ffffff 50%, transparent 50%);
      background-position:
        calc(100% - 0.95rem) calc(50% - 0.1rem),
        calc(100% - 0.62rem) calc(50% - 0.1rem);
      background-size: 0.33rem 0.33rem, 0.33rem 0.33rem;
      background-repeat: no-repeat;
    }

    select option {
      background: #000000;
      color: #ffffff;
    }

    button {
      box-sizing: border-box;
      border: none;
      border-radius: 0;
      font-family: "Viper";
      font-weight: 700;
      font-size: medium;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition:
        transform 80ms ease,
        box-shadow 120ms ease,
        background 120ms ease,
        color 120ms ease;
    }

    button:disabled {
      cursor: not-allowed;
    }

    .grid {
      display: grid;
      gap: 0.75rem;
    }

    .grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    a {
      color: var(--line);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    #log {
      min-height: 120px;
      max-height: 260px;
      padding: 0.75rem 1rem;
      border: 1px solid rgb(255, 255, 255);
      border-radius: 0px;
      background: rgb(0, 0, 0);
      color: var(--text);
      font-family: "IBMPlexMono";
      white-space: pre-wrap;
      overflow-y: auto;
      box-shadow: inset 0 0 0 1px rgba(58, 167, 255, 0.08);
    }

    #brief-frame {
      display: block;
      width: 850px;
      max-width: 100%;
      height: 70vh;
      margin: 0 auto;
      border: 1px solid rgb(255, 255, 255);
      border-radius: 0px;
      background: #0a1310;
      box-shadow: 0 0 0 1px rgba(58, 167, 255, 0.1);
    }

    .layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1rem;
      align-items: start;
    }

    .layout.collapsed {
      grid-template-columns: 1fr;
      justify-content: center;
    }

    .layout.collapsed .side-column {
      display: none;
    }

    .layout.collapsed .main-column {
      max-width: 960px;
      margin: 0 auto;
    }

    .main-column section:first-child,
    .side-column section:first-child {
      margin-top: 0;
    }

    .button-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.5rem;
    }

    .button-row button {
      width: auto;
    }

    .button-row.controls-row {
      justify-content: center;
      grid-template-columns: repeat(auto-fit, minmax(170px, 170px));
    }

    section.mfd-box {
      --mfd-gap: 0.5rem;
      --mfd-btn-py: 0.18rem;
      --mfd-btn-px: 0.4rem;
      --mfd-cutout-x: 0.45rem;
      --mfd-cutout-top: 0.6rem;
      --mfd-cutout-bottom: 0.38rem;
      --mfd-anchor-offset: -1.15rem;
      --mfd-bottom-offset: -0.5rem;
      --mfd-bottom-reserve: 0.55rem;
      position: relative;
      margin-top: 1.3rem;
      padding-top: 0.7rem;
      overflow: visible;
    }

    section.mfd-box .mfd-anchor {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: var(--mfd-gap);
      margin-top: var(--mfd-anchor-offset);
      padding: 0 0.6rem;
      position: relative;
    }

    section.mfd-box .mfd-anchor.mfd-anchor-right {
      justify-content: flex-end;
    }

    section.mfd-box :is(.mfd-anchor button, .mfd-bottom-btn) {
      position: relative;
      z-index: 1;
      min-width: 0;
      width: auto;
      border: none;
      background: var(--bg);
      color: #ffffff;
      box-shadow: none;
      padding: var(--mfd-btn-py) var(--mfd-btn-px);
      white-space: nowrap;
      font-size: 1.05rem;
    }

    section.mfd-box .mfd-anchor button::before {
      content: "";
      position: absolute;
      left: calc(-1 * var(--mfd-cutout-x));
      right: calc(-1 * var(--mfd-cutout-x));
      top: calc(-1 * var(--mfd-cutout-top) + 0.02rem);
      height: var(--mfd-cutout-top);
      background: var(--bg);
      pointer-events: none;
    }

    section.mfd-box :is(.mfd-anchor button, .mfd-bottom-btn):hover {
      transform: none;
      color: var(--line);
      text-shadow: 0 0 8px rgba(58, 167, 255, 0.35);
      box-shadow: none;
    }

    section.mfd-box :is(.mfd-anchor button, .mfd-bottom-btn):active:not(:disabled) {
      background: #ffffff;
      color: #000000;
      text-shadow: none;
      box-shadow: none;
    }

    section.mfd-box :is(.mfd-anchor button, .mfd-bottom-btn):focus-visible {
      outline: 1px solid var(--line);
      outline-offset: 2px;
    }

    section.mfd-box :is(.mfd-anchor button, .mfd-bottom-btn):disabled,
    section.mfd-box :is(.mfd-anchor button, .mfd-bottom-btn):disabled:hover {
      opacity: 1;
      cursor: not-allowed;
      color: #000000;
      background: #ffffff;
      text-shadow: none;
      box-shadow: none;
      transform: none;
      filter: none;
    }

    section.mfd-box .auto-export-mode-btn.is-active,
    section.mfd-box .auto-export-mode-btn.is-active:hover {
      background: #ffffff;
      color: #000000;
      text-shadow: none;
    }

    section.mfd-box .auto-export-mode-btn.is-active:active:not(:disabled) {
      background: var(--bg);
      color: var(--line);
      text-shadow: 0 0 8px rgba(58, 167, 255, 0.35);
    }

    section.mfd-box.mfd-with-bottom-btn {
      padding-bottom: var(--mfd-bottom-reserve);
    }

    section.mfd-box .mfd-bottom-btn {
      position: absolute;
      left: 50%;
      bottom: var(--mfd-bottom-offset);
      transform: translateX(-50%);
      z-index: 2;
    }

    section.mfd-box .mfd-bottom-btn::after {
      content: "";
      position: absolute;
      left: calc(-1 * var(--mfd-cutout-x));
      right: calc(-1 * var(--mfd-cutout-x));
      bottom: calc(-1 * var(--mfd-cutout-bottom) + 0.04rem);
      height: var(--mfd-cutout-bottom);
      background: var(--bg);
      pointer-events: none;
    }

    section.mfd-box .mfd-bottom-btn:not(.mfd-bottom-btn-right):is(:hover, :active:not(:disabled), :disabled) {
      transform: translateX(-50%);
    }

    section.mfd-box .mfd-bottom-btn.mfd-bottom-btn-right {
      left: auto;
      right: 0.85rem;
      transform: none;
    }

    section.mfd-box .mfd-bottom-btn.mfd-bottom-btn-right:is(:hover, :active:not(:disabled), :disabled) {
      transform: none;
    }

    section.mfd-toolbar {
      --mfd-gap: 5rem;
    }

    .button-row.controls-row button,
    .chain button {
      width: 170px;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .heading-zero {
      margin: 0;
    }

    .heading-top-zero {
      margin-top: 0;
    }

    .spacer-sm {
      margin-bottom: 0.75rem;
    }

    .page-select {
      max-width: 240px;
    }

    .grid-start {
      align-items: start;
    }

    .status-value {
      font-family: "IBMPlexMono";
    }

    .sortable {
      min-height: 40px;
      margin: 0.5rem 0 0;
      padding: 0;
      border: 1px dashed rgba(58, 167, 255, 0.35);
      border-radius: 8px;
      list-style: none;
      font-weight: 700;
    }

    .sortable li {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid rgba(58, 167, 255, 0.12);
      color: var(--text);
      cursor: grab;
    }

    .sortable li:last-child {
      border-bottom: none;
    }

    .sortable li.dragging {
      opacity: 0.6;
      background: rgba(58, 167, 255, 0.08);
    }

    .pill-handle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border: 1px solid rgba(58, 167, 255, 0.6);
      border-radius: 4px;
      background: var(--panel-strong);
      color: #ffffff;
      font-size: 12px;
      box-shadow: 0 0 6px rgba(58, 167, 255, 0.35);
    }

    .pill-handle.page {
      background: #0f2337;
      color: #ffffff;
    }

    .pill-handle.available {
      background: #0f1e31;
      color: #ffffff;
    }

    .page-shortcuts {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin: 0 auto 0.5rem;
    }

    .page-shortcuts button {
      width: auto;
      padding: 0.35rem 0.75rem;
    }

    section.mfd-page-nav {
      --mfd-gap: 1rem;
    }

    section.mfd-page-nav .mfd-anchor {
      margin-bottom: 0.65rem;
    }

    .chain {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }

    section.mfd-flow {
      --mfd-gap: 1.65rem;
      --mfd-cutout-bottom: 0.0rem;
      --mfd-bottom-offset: -1.5rem;
      --mfd-bottom-reserve: 0.9rem;
    }

    section.mfd-flow .mfd-anchor {
      align-items: flex-start;
    }

    section.mfd-settings,
    section.mfd-theater {
      --mfd-cutout-bottom: 0.6rem;
      --mfd-bottom-reserve: 0.9rem;
      --mfd-bottom-offset: 0.6rem;
    }

    section.mfd-theater #copy_to_kto_btn {
      position: absolute;
      left: auto !important;
      right: 0.85rem !important;
      bottom: var(--mfd-bottom-offset);
      transform: none !important;
      z-index: 2;
    }

    section.mfd-theater #copy_to_kto_btn::after {
      content: "";
      position: absolute;
      left: calc(-1 * var(--mfd-cutout-x));
      right: calc(-1 * var(--mfd-cutout-x));
      bottom: calc(-1 * var(--mfd-cutout-bottom) + 0.04rem);
      height: var(--mfd-cutout-bottom);
      background: var(--bg);
      pointer-events: none;
    }

    section.mfd-theater #copy_to_kto_btn:is(:hover, :active:not(:disabled), :disabled) {
      transform: none !important;
    }

    section.mfd-status {
      --mfd-cutout-top: 0.2rem;
    }

    .badge-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.3rem 0.6rem;
      border: 1px solid #ffffff;
      border-radius: 0px;
      background: var(--bg);
      color: #ffffff;
      font-size: 1.05rem;
      box-shadow: none;
      font-weight: 700;
    }

    .badge.ok,
    .badge.muted {
      background: var(--bg);
      color: #ffffff;
      border-color: #ffffff;
      opacity: 1;
    }

    .badge.warn,
    .badge.error {
      background: #9f1010;
      color: #ffffff;
      border-color: #ffffff;
      opacity: 1;
    }

    .badge-row #toggle-toolbar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      width: auto;
      height: 32px;
      padding: 0.25rem 0.8rem;
      border: none;
      background: var(--bg);
      color: #ffffff;
      font-size: 1.05rem;
      white-space: nowrap;
      box-shadow: none;
    }

    .badge-row #toggle-toolbar:hover {
      color: var(--line);
      text-shadow: none;
      box-shadow: none;
      transform: none;
    }

    .badge-row #toggle-toolbar:active:not(:disabled) {
      background: #ffffff;
      color: #000000;
      text-shadow: none;
      box-shadow: none;
      transform: none;
    }

    .truncate {
      display: inline-block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: help;
    }

    .settings-meta {
      margin-top: 0.65rem;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.45rem;
      font-family: "IBMPlexMono";
      font-size: 0.78rem;
      letter-spacing: 0.03em;
      opacity: 0.84;
    }

    .settings-meta a {
      text-transform: none;
      letter-spacing: inherit;
    }

    @media (max-width: 1024px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .grid.two {
        grid-template-columns: 1fr;
      }
    }

    @media print {
      .no-print {
        display: none !important;
      }

      body {
        padding: 0;
      }
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <header>
      <div>
        <h1>Falcon BMS HTML Briefing</h1>
      </div>
      <div class="badge-row">
        <button id="toggle-toolbar" type="button">Hide toolbar</button>
        <div class="badge" id="file-status" title="Briefing/callsign file changes">
          <span>FILES</span>
        </div>
        <div class="badge" id="overflow-status" title="PDF pages vs layout pages">
          <span>PDF</span>
        </div>
        <div class="badge muted" id="global-status-badge" title="Global config status">
          <span id="status-indicator">Idle</span>
        </div>
      </div>
    </header>

    <div class="layout">
      <div class="main-column">
        <section class="mfd-box mfd-toolbar no-print">
          <div class="button-row controls-row mfd-anchor">
            <button id="generate-btn-main" class="generate-brief-btn">Gen brf</button>
            <button id="save-edits-btn">Save</button>
            <button id="load-edits-btn">Load</button>
            <button id="reset-edits-btn">Reset</button>
          </div>
        </section>

        <section class="mfd-box mfd-page-nav">
          <div class="page-shortcuts mfd-anchor" id="page-shortcuts"></div>
          <iframe id="brief-frame" src="/brief" title="Briefing preview"></iframe>
        </section>

        <section class="mfd-box mfd-flow mfd-with-bottom-btn no-print">
          <div class="chain mfd-anchor">
            <button id="generate-btn-output" class="generate-brief-btn">Gen brf</button>
            <button id="pdf-btn">Gen PDF</button>
            <button id="export-btn">Export</button>
            <button id="auto-export-mode-btn" class="auto-export-mode-btn" type="button">AUTO-EXPORT<br>OFF</button>
          </div>
          <button id="open-pdf-btn" class="mfd-bottom-btn">Open PDF</button>
        </section>

        <section class="mfd-box mfd-layout">
          <div class="mfd-anchor mfd-anchor-right no-print">
            <button id="save-layout-btn" type="button">Save layout</button>
          </div>
          <div class="panel-head">
            <h3 class="heading-zero">Layout</h3>
          </div>
          <div class="spacer-sm">
            <label for="page-select">Page</label>
            <select id="page-select" class="page-select"></select>
          </div>
          <div class="grid two grid-start">
            <div>
              <label>Page sections</label>
              <ul id="section-list" class="sortable"></ul>
            </div>
            <div>
              <label>Available sections</label>
              <ul id="available-list" class="sortable"></ul>
            </div>
          </div>
        </section>

        <section>
          <h3 class="heading-top-zero">Messages</h3>
          <div id="log">Waiting...</div>
        </section>
      </div>

      <div class="side-column">
        <section id="status-card" class="mfd-box mfd-status">
          <div class="mfd-anchor mfd-anchor-right no-print">
            <button id="reload-btn" type="button" title="Reload BMS config">Reload</button>
          </div>
          <h3 class="heading-top-zero">STATUS</h3>
          <div class="grid two">
            <div>
              <label>Config path</label>
              <div id="config-path" class="truncate status-value" title="–">–</div>
            </div>
            <div>
              <label>BMS base dir</label>
              <div id="base-dir" class="truncate status-value" title="–">–</div>
            </div>
            <div>
              <label>Theater</label>
              <div id="theater" class="status-value">–</div>
            </div>
            <div>
              <label>Callsign</label>
              <div id="callsign" class="status-value">–</div>
            </div>
            <div>
              <label>Target folder</label>
              <div id="target-folder" class="truncate status-value" title="–">–</div>
            </div>
            <div>
              <label>PDF output dir</label>
              <div id="pdf-dir-status" class="truncate status-value" title="–">–</div>
            </div>
          </div>
        </section>

        <section class="mfd-box mfd-settings">
          <div class="mfd-anchor mfd-anchor-right no-print">
            <button type="submit" form="config-form" title="Save application settings">Save</button>
          </div>
          <div class="panel-head">
            <h3 class="heading-zero">Settings</h3>
          </div>
          <form id="config-form" class="grid two">
            <div>
              <label for="bms_version">BMS version</label>
              <select id="bms_version" name="bms_version"></select>
            </div>
            <div>
              <label for="bms_available_versions">Available versions</label>
              <input id="bms_available_versions" name="bms_available_versions" placeholder="4.37, 4.38">
            </div>
            <div>
              <label for="default_airframe">Airframe</label>
              <select id="default_airframe" name="default_airframe">
                <option value="F-16">F-16</option>
                <option value="F-15">F-15</option>
              </select>
            </div>
            <div>
              <label for="wine_prefix">Wine prefix (Linux)</label>
              <input id="wine_prefix" name="wine_prefix" placeholder="/path/to/wineprefix">
            </div>
            <div>
              <label for="output_dir">Output dir</label>
              <input id="output_dir" name="output_dir" placeholder="./output">
            </div>
            <div>
              <label for="pdf_output_dir">PDF output dir</label>
              <input id="pdf_output_dir" name="pdf_output_dir" placeholder="./kneeboards">
            </div>
          </form>
        </section>

        <section class="mfd-box no-print">
          <div class="panel-head">
            <h3 class="heading-zero">CAM</h3>
          </div>
          <div class="grid two">
            <div>
              <label for="cam-save-select">Campaign save (.cam/.trn/.tac)</label>

    function log(message) {
      const ts = new Date().toLocaleTimeString();
      if (!logEl) return;
      logLines.unshift(`[${ts}] ${message}`);
      if (logLines.length > LOG_MAX_LINES) {
        logLines.length = LOG_MAX_LINES;
      }
      logEl.textContent = logLines.join("\n");

    function updateCamSummaryUi(camData, outputPath = null) {
      if (!camData) return;
      if (!outputPath) return;
      if (camSaveSelect) {
        camSaveSelect.title = `CAM parsed: ${outputPath}`;
      }
    }

    function getCamPackages(camData) {
      if (!camData || !Array.isArray(camData.packages)) return [];
      return camData.packages.filter((pkg) => pkg && typeof pkg === "object");
    }

    function getMissionName(entity) {
      if (!entity || typeof entity !== "object") return "";
      const tasking = entity.tasking;
      if (!tasking || typeof tasking !== "object") return "";
      const missionName = typeof tasking.mission_name === "string" ? tasking.mission_name.trim() : "";
      if (missionName && missionName.toUpperCase() !== "NONE") return missionName;
      const oldMissionName = typeof tasking.old_mission_name === "string" ? tasking.old_mission_name.trim() : "";
      if (oldMissionName && oldMissionName.toUpperCase() !== "NONE") return oldMissionName;
      return "";
    }

    function formatCamTime(value) {
      if (typeof value !== "string") return "";
      const raw = value.trim();
      if (!raw) return "";
      const normalized = raw.replace(/z$/i, "");

      const hhmmssColon = normalized.match(/^(\d{1,2})\s*:\s*(\d{2})(?:\s*:\s*(\d{2})(?:\.\d+)?)?$/);
      if (hhmmssColon) {
        const hh = hhmmssColon[1].padStart(2, "0");
        const mm = hhmmssColon[2];
        const ss = (hhmmssColon[3] || "00").padStart(2, "0");
        return `${hh}:${mm}:${ss}z`;
      }

      const hhmmssDigits = normalized.match(/^(\d{3,6})$/);
      if (hhmmssDigits) {
        const digits = hhmmssDigits[1];
        if (digits.length <= 4) {
          const hhmm = digits.padStart(4, "0");
          return `${hhmm.slice(0, 2)}:${hhmm.slice(2)}:00z`;
        }
        const hhmmss = digits.padStart(6, "0");
        return `${hhmmss.slice(0, 2)}:${hhmmss.slice(2, 4)}:${hhmmss.slice(4)}z`;
      }

      return raw;
    }

    function formatCamAircraftWithCount(flight) {
      const aircraft = typeof flight?.aircraft === "string" ? flight.aircraft.trim() : "";
      if (!aircraft) return "";
      if (/^\d+\s+/.test(aircraft)) return aircraft;

      const rawCount =
        flight?.aircraft_count ??
        flight?.aircraft_num ??
        flight?.flight_size ??
        flight?.num_aircraft;
      const parsedCount = Number.parseInt(String(rawCount ?? ""), 10);
      if (Number.isFinite(parsedCount) && parsedCount > 0) {
        return `${parsedCount} ${aircraft}`;
      }
      return aircraft;
    }

    function getCamPackageLabel(pkg, index) {
      const packageNumber = Number.isFinite(pkg?.package_number) ? String(pkg.package_number) : `#${index + 1}`;
      const missionName = getMissionName(pkg);
      return missionName ? `${packageNumber} (${missionName})` : packageNumber;
    }

    function getSavedCamSupportPackageIndex() {
      const raw = localStorage.getItem(CAM_SUPPORT_PACKAGE_SAVED_KEY);
      const parsed = Number.parseInt(String(raw ?? ""), 10);
      if (!Number.isFinite(parsed) || parsed < 0) return null;
      return parsed;
    }

    function saveCamSupportPackageIndex(index) {
      if (!Number.isFinite(index) || index < 0) {
        localStorage.removeItem(CAM_SUPPORT_PACKAGE_SAVED_KEY);
        return;
      }
      localStorage.setItem(CAM_SUPPORT_PACKAGE_SAVED_KEY, String(index));
    }

    function saveCurrentCamSupportPackageSelection() {
      saveCamSupportPackageIndex(getSelectedCamPackageIndex());
    }

    function getPreviewCamPackageSelect() {
      const cw = briefFrame?.contentWindow;
      if (!cw || !cw.document) return null;
      return cw.document.getElementById(CAM_PREVIEW_PACKAGE_SELECT_ID);
    }

    function getPreviewCamPackageQuery() {
      const cw = briefFrame?.contentWindow;
      if (!cw || !cw.document) return null;
      return cw.document.getElementById(CAM_PREVIEW_PACKAGE_QUERY_ID);
    }

    function packageSearchText(pkg, index) {
      const label = getCamPackageLabel(pkg, index);
      const packageNumber = Number.isFinite(pkg?.package_number) ? String(pkg.package_number) : "";
      const flights = Array.isArray(pkg?.flights) ? pkg.flights : [];
      const roleTokens = flights
        .map((flight) => getMissionName(flight))
        .filter((name) => typeof name === "string" && name.trim())
        .join(" ");
      return `${label} ${packageNumber} ${roleTokens}`.toLowerCase();
    }

    function bindCamPackageSelectorInPreview() {
      const select = getPreviewCamPackageSelect();
      const query = getPreviewCamPackageQuery();
      if (!select) return false;
      if (select.dataset.camBound === "1") return true;
      select.dataset.camBound = "1";
      select.addEventListener("change", () => {
        if (!lastCamData) return;
        const selected = getSelectedCamPackageIndex();
        if (!Number.isFinite(selected)) return;
        applyCamPackageToSupportingTable(lastCamData, selected, false);
      });
      if (query && query.dataset.camBound !== "1") {
        query.dataset.camBound = "1";
        query.addEventListener("input", () => {
          if (!lastCamData) return;
          const before = getSelectedCamPackageIndex();
          updateCamPackageSelector(lastCamData);
          const after = getSelectedCamPackageIndex();
          if (Number.isFinite(after) && after !== before) {
            applyCamPackageToSupportingTable(lastCamData, after, true);
          }
        });
      }
      return true;
    }

    function updateCamPackageSelector(camData) {
      const select = getPreviewCamPackageSelect();
      const query = getPreviewCamPackageQuery();
      if (!select) return false;
      const packages = getCamPackages(camData);
      const previousValue = Number.parseInt(select.value, 10);
      const queryText = (query?.value || "").trim().toLowerCase();
      const packageEntries = packages.map((pkg, index) => ({
        index,
        label: getCamPackageLabel(pkg, index),
        search: packageSearchText(pkg, index),
      }));
      const filtered = queryText
        ? packageEntries.filter((entry) => entry.search.includes(queryText))
        : packageEntries;
      select.innerHTML = "";
      if (!filtered.length) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = packages.length ? "No matching packages" : "No packages loaded";
        select.appendChild(option);
        select.disabled = true;
        pendingCamPackageIndex = null;
        return true;
      }

      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = "Select package";
      select.appendChild(placeholder);

      filtered.forEach((entry) => {
        const option = document.createElement("option");
        option.value = String(entry.index);
        option.textContent = entry.label;
        select.appendChild(option);
      });

      let selectedIndex = pendingCamPackageIndex;
      if (queryText && filtered.length === 1) {
        selectedIndex = filtered[0].index;
      }
      if (!Number.isFinite(selectedIndex)) {
        const savedIndex = getSavedCamSupportPackageIndex();
        if (Number.isFinite(savedIndex) && savedIndex >= 0 && savedIndex < packages.length) {
          selectedIndex = savedIndex;
        }
      }
      if (!Number.isFinite(selectedIndex)) {
        if (Number.isFinite(previousValue) && previousValue >= 0 && previousValue < packages.length) {
          selectedIndex = previousValue;
        }
      }
      if (Number.isFinite(selectedIndex)) {
        const isVisible = filtered.some((entry) => entry.index === selectedIndex);
        if (!isVisible) {
          selectedIndex = null;
        }
      }
      if (Number.isFinite(selectedIndex)) {
        select.value = String(selectedIndex);
      } else {
        select.value = "";
      }
      select.disabled = false;
      return true;
    }

    function getSelectedCamPackageIndex() {
      const select = getPreviewCamPackageSelect();
      if (!select) return Number.isFinite(pendingCamPackageIndex) ? pendingCamPackageIndex : null;
      const parsed = Number.parseInt(select.value, 10);
      if (!Number.isFinite(parsed) || parsed < 0) return null;
      return parsed;
    }

    function buildSupportRowFromCamFlight(flight, pkg) {
      const flightTiming = (flight && typeof flight.timing === "object") ? flight.timing : {};
      return [
        typeof flight?.callsign === "string" ? flight.callsign : "",
        Number.isFinite(flight?.flight_number) ? String(flight.flight_number) : "",
        getMissionName(flight),
        formatCamAircraftWithCount(flight),
        formatCamTime(flightTiming.takeoff_time_z || ""),
        formatCamTime(flightTiming.push_time_z || ""),
        formatCamTime(flightTiming.time_on_target_z || ""),
        typeof flight?.l16 === "string" ? flight.l16 : ""
      ];
    }

    function buildSupportRowsFromCamPackage(pkg) {
      const flights = Array.isArray(pkg?.flights) ? pkg.flights.filter((flight) => flight && typeof flight === "object") : [];
      const rows = flights.slice(0, CAM_SUPPORT_MAX_ROWS).map((flight) => buildSupportRowFromCamFlight(flight, pkg));
      if (!rows.length) {
        const packageTiming = (pkg && typeof pkg.timing === "object") ? pkg.timing : {};
        rows.push([
          "",
          Number.isFinite(pkg?.package_number) ? String(pkg.package_number) : "",
          getMissionName(pkg),
          "",
          formatCamTime(packageTiming.takeoff_time_z || ""),
          formatCamTime(packageTiming.push_time_z || ""),
          formatCamTime(packageTiming.time_on_target_z || ""),
          ""
        ]);
      }
      while (rows.length < CAM_SUPPORT_MAX_ROWS) {
        rows.push(["", "", "", "", "", "", "", ""]);
      }
      return { rows, flightCount: flights.length };
    }

    function getCamL16ByFlightNumber(camData) {
      const out = new Map();
      const packages = getCamPackages(camData);
      packages.forEach((pkg) => {
        const flights = Array.isArray(pkg?.flights) ? pkg.flights : [];
        flights.forEach((flight) => {
          if (!flight || typeof flight !== "object") return;
          const number = Number.parseInt(String(flight.flight_number ?? ""), 10);
          if (!Number.isFinite(number)) return;
          const l16 = typeof flight.l16 === "string" ? flight.l16.trim() : "";
          out.set(number, l16);
        });
      });
      return out;
    }

    function applyCamL16ToMainPackage(camData, silent = false) {
      if (!camData) return false;
      const l16ByFlight = getCamL16ByFlightNumber(camData);
      const cw = briefFrame?.contentWindow;
      if (!cw || !cw.document) return false;
      const table = cw.document.getElementById("package");
      if (!table) return false;
      const rows = Array.from(table.querySelectorAll("tbody tr"));
      if (!rows.length) return false;

      let applied = 0;
      const saved = getSavedEdits();
      rows.forEach((row, rowIndex) => {
        const cells = Array.from(row.querySelectorAll("td"));
        if (cells.length < 8) return;
        const number = Number.parseInt((cells[1].textContent || "").trim(), 10);
        const value = Number.isFinite(number) ? (l16ByFlight.get(number) || "") : "";
        cells[7].textContent = value;
        const l16CellId = `package_main_l16_${rowIndex + 1}`;
        const domId = cells[7].id || l16CellId;
        saved[domId] = value;
        if (value) applied += 1;
      });
      localStorage.setItem("contenteditables", JSON.stringify(saved));
      if (!silent && applied > 0) {
        log(`Main package L16 applied for ${applied} flights`);
      }
      return applied > 0;
    }
    
    function getMoonPhase(camData) {
      if (!camData || (!camData.moonPhase)) return "";
      return camData.moonPhase;
    }

    function applyCamMoonPhaseToWeatherTable(camData, silent = false) {
      const moonPhase = getMoonPhase(camData);
      const id = CAM_MOONPHASE_CELL_ID
      if (!moonPhase) {
        if (!silent) log("No moon phase in CAM data.");
        return false;
      }
      const saved = getSavedEdits()
      saved[id] = moonPhase;
      localStorage.setItem("contenteditables", JSON.stringify(saved));

      const cw = briefFrame?.contentWindow;
      if (cw && cw.document) {
        const el = cw.document.getElementById(id);
        if (el) el.textContent = saved[id] || "";
        if (typeof cw.saveChangedData === "function") {
          try {
            cw.saveChangedData();
          } catch {
            // keep localStorage update even if saveChangedData fails
          }
        }
        if (!silent) {
          log(`Moon phase populated from CAM file.`);
        }
      }
      return true;
    }

    function applyCamPackageToSupportingTable(camData, packageIndex = null, silent = false) {
      const packages = getCamPackages(camData);
      if (!packages.length) {
        if (!silent) log("No CAM package data loaded");
        return false;
      }
      let selectedIndex = packageIndex !== null ? packageIndex : getSelectedCamPackageIndex();
      if (!Number.isFinite(selectedIndex) || selectedIndex < 0 || selectedIndex >= packages.length) {
        selectedIndex = 0;
      }

      const selectedPackage = packages[selectedIndex];
      const { rows, flightCount } = buildSupportRowsFromCamPackage(selectedPackage);
      const values = rows.flat().slice(0, CAM_SUPPORT_CELL_IDS.length);
      const saved = getSavedEdits();
      CAM_SUPPORT_CELL_IDS.forEach((id, idx) => {
        saved[id] = values[idx] || "";
      });
      localStorage.setItem("contenteditables", JSON.stringify(saved));

      const cw = briefFrame?.contentWindow;
      if (cw && cw.document) {
        CAM_SUPPORT_CELL_IDS.forEach((id) => {
          const el = cw.document.getElementById(id);
          if (el) el.innerHTML = saved[id] || "";
        });
        if (typeof cw.saveChangedData === "function") {
          try {
            cw.saveChangedData();
          } catch {
            // keep localStorage update even if saveChangedData fails
          }
        }
        const selector = getPreviewCamPackageSelect();
        if (selector) {
          selector.value = String(selectedIndex);
        }
        pendingCamPackageIndex = null;
        if (!silent) {
          log(`Supporting package populated from CAM package ${getCamPackageLabel(selectedPackage, selectedIndex)}`);
          if (flightCount > CAM_SUPPORT_MAX_ROWS) {
            log(`Package has ${flightCount} flights; showing first ${CAM_SUPPORT_MAX_ROWS}`);
          }
        }
        return true;
      }

      pendingCamPackageIndex = selectedIndex;
      if (!silent) log("Supporting package queued; open/generate briefing to apply on load");
      return false;
    }

    function camBullseyeToMapLatLng(camData) {
      const bull = camData && camData.bullseye ? camData.bullseye : null;
      if (!bull) return null;
      if (Number.isFinite(bull.map_lat) && Number.isFinite(bull.map_lng)) {
        return { lat: bull.map_lat, lng: bull.map_lng };
      }
      const x = bull.x;
      const y = bull.y;
      if (!Number.isFinite(x) || !Number.isFinite(y)) return null;
      // Legacy fallback: interpret as Falcon world scalar.
      const imageHeight = 4096;
      const falconHeight = 3359580;
      const lat = (x / falconHeight) * imageHeight - imageHeight;
      const lng = (y / falconHeight) * imageHeight;
      return { lat, lng };
    }

    function applyBullseyePosToStorage(latlng) {
      const saved = getSavedEdits();
      saved.bullseyePos = latlng;
      localStorage.setItem("contenteditables", JSON.stringify(saved));
    }

    function applyCamBullseyeToMap(camData, silent = false) {
      if (!camData || !camData.bullseye) return false;
      const x = camData.bullseye.x;
      const y = camData.bullseye.y;
      if (!Number.isFinite(x) || !Number.isFinite(y)) return false;

      const latlng = camBullseyeToMapLatLng(camData);
      if (!latlng || !Number.isFinite(latlng.lat) || !Number.isFinite(latlng.lng)) return false;
      applyBullseyePosToStorage(latlng);

      const frame = document.getElementById("brief-frame");
      const cw = frame?.contentWindow;
      if (cw && typeof cw.setBullseye === "function") {
        cw.setBullseye(latlng);
        if (typeof cw.saveChangedData === "function") {
          try {
            cw.saveChangedData();
          } catch {
            // keep localStorage value set above even if saveChangedData fails
          }
        }
        pendingCamBullseye = null;
        if (!silent) log("CAM bullseye applied to map");
        return true;
      }
      pendingCamBullseye = camData;
      if (!silent) log("CAM bullseye queued; open/generate briefing to apply on map load");
      return false;
    }

    function applyAutoExportMode(onChange, pdfOnly) {
      autoExportOnChange = !!onChange;
      autoExportPdfOnly = !!(onChange && pdfOnly);
      if (!autoExportModeBtn) return;
      autoExportModeBtn.classList.toggle("is-active", autoExportOnChange);
      let stateLabel = "OFF";
      if (!autoExportOnChange) {
        autoExportModeBtn.title = "Auto-export disabled";
      } else if (autoExportPdfOnly) {
        stateLabel = "PDF ONLY";
        autoExportModeBtn.title = "Auto-export enabled: PDF only";
      } else {
        stateLabel = "ON";
        autoExportModeBtn.title = "Auto-export enabled";
      }
      autoExportModeBtn.innerHTML = `AUTO-EXPORT<br>${stateLabel}`;
    }

    function getAutoExportModeIndex() {
      if (!autoExportOnChange) return 0;
      return autoExportPdfOnly ? 2 : 1;
    }

    function applyCopyToKtoMode(enabled) {
      copyToKtoEnabled = !!enabled;
      if (!copyToKtoBtn) return;
      copyToKtoBtn.classList.toggle("is-active", copyToKtoEnabled);
      copyToKtoBtn.innerHTML = `COPY TO KTO<br>${copyToKtoEnabled ? "ON" : "OFF"}`;
      copyToKtoBtn.title = copyToKtoEnabled ? "Copy to KTO enabled" : "Copy to KTO disabled";
    }

    async function fetchJSON(url, options = {}) {
      const res = await fetch(url, { headers: { "Content-Type": "application/json" }, ...options });
      if (!res.ok) {
        const detail = await res.text();
        throw new Error(detail || `${res.status} ${res.statusText}`);
      }
      return res.json();
    }

    function updateBadges({ briefChanged, callsignChanged, pdfOverflow }) {
      if (fileBadge) {
        fileBadge.classList.remove("ok", "error", "warn", "muted");
        let cls = "ok";
        if (briefChanged || callsignChanged) cls = "error";
        if (briefChanged === undefined || briefChanged === null) cls = "muted";
        fileBadge.classList.add(cls);
        fileBadge.title = "Briefing/callsign unchanged";
        if (cls === "error") fileBadge.title = "Briefing.txt or callsign.ini changed on disk";
        if (cls === "muted") fileBadge.title = "File change status unknown (generate/preview once)";
      }
      if (overflowBadge) {
        overflowBadge.classList.remove("ok", "error", "warn", "muted");
        let cls = "ok";
        if (pdfOverflow === true) cls = "warn";
        if (pdfOverflow === undefined || pdfOverflow === null) cls = "muted";
        overflowBadge.classList.add(cls);
        overflowBadge.title = cls === "warn" ? "PDF has more pages than layout" : (cls === "ok" ? "PDF matches layout page count" : "PDF status unknown (generate PDF once)");
      }
    }

    function populateVersionSelect(available, current) {
      const opts = (available || "").split(",").map(v => v.trim()).filter(Boolean);
      bmsSelect.innerHTML = "";
      if (opts.length === 0) {
        const o = document.createElement("option");

    function formatCamSaveLabel(save) {
      if (!save || typeof save !== "object") return "";
      const name = typeof save.name === "string" ? save.name : "";
      const mtime = Number(save.mtime);
      if (!name) return "";
      if (!Number.isFinite(mtime)) return name;
      return `${name} (${new Date(mtime * 1000).toLocaleString()})`;
    }

    function populateCamSaveSelect(saves) {
      if (!camSaveSelect) return;
      const previousValue = camSaveSelect.value || "";
      let storedValue = "";
      try {
        storedValue = localStorage.getItem(CAM_LAST_SAVE_PATH_KEY) || "";
      } catch {
        storedValue = "";
      }
      camSaveSelect.innerHTML = "";
      if (!Array.isArray(saves) || saves.length === 0) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "No saves found";
        camSaveSelect.appendChild(option);
        camSaveSelect.disabled = true;
        if (camLoadBtn) camLoadBtn.disabled = true;
        return;
      }

      let optionCount = 0;
      saves.forEach((save) => {
        if (!save || typeof save.path !== "string" || !save.path) return;
        const option = document.createElement("option");
        option.value = save.path;
        option.textContent = formatCamSaveLabel(save) || save.path;
        option.title = save.path;
        camSaveSelect.appendChild(option);
        optionCount += 1;
      });
      if (!optionCount) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "No saves found";
        camSaveSelect.appendChild(option);
        camSaveSelect.disabled = true;
        if (camLoadBtn) camLoadBtn.disabled = true;
        return;
      }

      camSaveSelect.disabled = false;
      if (camLoadBtn) camLoadBtn.disabled = false;
      const hasPrevious = Array.from(camSaveSelect.options).some((option) => option.value === previousValue);
      const hasStored = !!storedValue && Array.from(camSaveSelect.options).some((option) => option.value === storedValue);
      if (hasPrevious) {
        camSaveSelect.value = previousValue;
      } else if (hasStored) {
        camSaveSelect.value = storedValue;
      } else {
        camSaveSelect.selectedIndex = 0;
      }
    }

    async function runExportFlow(source = "manual") {
      if (pdfBusy || exportBusy) return;
      setPdfBusy(true);
      setExportBusy(true);
      try {
        const overrides = currentOverrides();
        const pdfOnlyAuto = source === "auto" && autoExportPdfOnly;
        const latestEdits = getLatestEdits();
        if (source === "auto") {
          try {
            const prevRes = await fetchJSON("/api/preview", { method: "POST", body: JSON.stringify(overrides) });
            log(`Auto-export preview refreshed at ${prevRes.output_file}`);
            await refreshBrief(true);
          } catch (err) {
            log(`Auto-export preview refresh failed: ${err.message}`);
          }
        }
        const payload = { content: latestEdits, ...overrides };
        const mapImage = await captureMapImage();
        if (mapImage) {
          payload.content.map_image = mapImage;
        }
        // pass theater overrides without persisting to disk
        payload.theater = {
          copy_to_kto: copyToKtoEnabled
        };
        const pdfRes = await fetchJSON("/api/pdf", { method: "POST", body: JSON.stringify(payload) });
        log(`PDF generated at ${pdfRes.pdf_file}`);
        if (!pdfOnlyAuto) {
          const expRes = await fetchJSON("/api/export", { method: "POST", body: JSON.stringify({ ...overrides, theater: payload.theater }) });
          log(`Exported kneeboards to ${expRes.target_folder}`);
        } else {
          log("Auto-export PDF-only mode: skipped DDS kneeboard export");
        }
        if (source === "auto") {
          log("Auto-export completed");
        }
        if (source === "manual") {
          skipNextAutoExportEdge = true;
        }
        await pollStatusBadges();
      } catch (err) {
        const prefix = source === "auto" ? "Auto-export failed" : "Export failed";
        log(`${prefix}: ${err.message}`);
      } finally {
        setExportBusy(false);
        setPdfBusy(false);
      }
    }

    async function maybeAutoExportOnFileChange(data) {
      const filesChangedNow = !!(data.brief_changed || data.callsign_changed);
      if (skipNextAutoExportEdge && !filesChangedNow) {
        skipNextAutoExportEdge = false;
      }
      const changeEdge = filesChangedNow && !filesChangedState;
      if (changeEdge && (pdfBusy || exportBusy)) {
        pendingAutoExport = true;
      }
      filesChangedState = filesChangedNow;
      if (!changeEdge && !pendingAutoExport) return;
      if (pendingAutoExport && !filesChangedNow) {
        pendingAutoExport = false;
        return;
      }
      if (skipNextAutoExportEdge) {
        skipNextAutoExportEdge = false;
        return;
      }
      if (!autoExportOnChange) {
        pendingAutoExport = false;
        return;
      }
      if (pdfBusy || exportBusy) return;
      pendingAutoExport = false;
      const pdfOnlyAuto = autoExportPdfOnly;
      log(`File change detected. Running auto-export${pdfOnlyAuto ? " (PDF only)" : ""}.`);
      await runExportFlow("auto");
    }

    function getFrameScroll(frame) {
      try {
        const win = frame.contentWindow;
        if (!win || !win.document) return 0;

      } catch {

    }

    function refreshBrief(waitForLoad = false) {
      const frame = document.getElementById("brief-frame");
      if (!frame) return waitForLoad ? Promise.resolve(false) : undefined;
      const prevScroll = getFrameScroll(frame);
      let resolveLoad = null;
      let timeoutId = null;
      const loadPromise = waitForLoad ? new Promise((resolve) => { resolveLoad = resolve; }) : null;
      frame.addEventListener("load", function handleLoad() {
        frame.removeEventListener("load", handleLoad);
        if (timeoutId) {
          clearTimeout(timeoutId);
        }
        requestAnimationFrame(() => {
          try {
            frame.contentWindow?.scrollTo(0, prevScroll);
          } catch {
            /* ignore */
          }
          if (resolveLoad) {
            // Give inner scripts a frame to settle (map rendering/readbacks).
            requestAnimationFrame(() => resolveLoad(true));
          }
        });
      });
      if (resolveLoad) {
        timeoutId = setTimeout(() => resolveLoad(false), 6000);
      }
      frame.src = "/brief?ts=" + Date.now();
      return loadPromise;
    }

    async function pollLogs() {
      try {
        const entries = await fetchJSON("/api/logs");
        entries.filter(e => e.id > lastLogId).forEach(e => {
          lastLogId = Math.max(lastLogId, e.id);
          log(`[${e.level}] ${e.msg}`);
        });
      } catch (err) {
        // Keep quiet on errors to avoid log spam
      }
    }

    async function loadTheater(runPreview = false) {
      try {
        const data = await fetchJSON("/api/theater");
        theater = data;
        const tName = document.getElementById("theater_name");
        const tTarget = document.getElementById("target_folder_field");
        const tMap = document.getElementById("map_file_field");
        if (tName) tName.value = data.theater || "";
        if (tTarget) tTarget.value = data.target_folder || "";
        if (tMap) tMap.value = data.map_file || "";
        applyCopyToKtoMode(!!data.copy_to_kto);
        if (runPreview) {
          await doPreview(currentOverrides());
        }
      } catch (err) {
        log(`Failed to load theater: ${err.message}`);
      }
    }

    function renderPages() {
      const pageSelect = document.getElementById("page-select");
      const list = document.getElementById("section-list");
      const availableList = document.getElementById("available-list");
      const shortcutBar = document.getElementById("page-shortcuts");
      if (!pageSelect || !list || !availableList) return;
      pageSelect.innerHTML = "";
      list.innerHTML = "";
      availableList.innerHTML = "";
      if (shortcutBar) shortcutBar.innerHTML = "";
      if (!pages || pages.length === 0) return;

      pages.forEach((p, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        opt.textContent = `Page ${idx + 1}`;
        pageSelect.appendChild(opt);
        if (shortcutBar) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = `Page ${idx + 1}`;
          btn.addEventListener("click", () => scrollToPage(idx + 1));
          shortcutBar.appendChild(btn);
        }
      });
      if (currentPageIndex >= pages.length) currentPageIndex = 0;
      pageSelect.value = currentPageIndex;

      const used = new Set(pages.flat().filter(Boolean));
      const availableSections = allSections.filter((s) => !used.has(s));

      availableSections.forEach((section) => {
        const li = document.createElement("li");
        li.draggable = true;
        li.dataset.section = section;
        li.innerHTML = `<span class="pill-handle available">+</span><span>${sectionLabels[section] || section}</span>`;
        availableList.appendChild(li);
      });

      const currentSections = pages[currentPageIndex] || [];
      currentSections.forEach((section) => {
        const li = document.createElement("li");
        li.draggable = true;
        li.dataset.section = section;
        li.innerHTML = `<span class="pill-handle page">⇅</span><span>${sectionLabels[section] || section}</span>`;
        list.appendChild(li);
      });
      attachDnD();
    }

    function getAfterElement(list, y) {
      const elements = [...list.querySelectorAll("li:not(.dragging)")];
      return elements.find((el) => {
        const box = el.getBoundingClientRect();
        return y < box.top + box.height / 2;
      });
    }
    function attachDnD() {
      if (dndAttached) return;
      dndAttached = true;
      const availableList = document.getElementById("available-list");
      const sectionList = document.getElementById("section-list");
      [availableList, sectionList].forEach((list) => {
        list.addEventListener("dragstart", (e) => {
          const li = e.target.closest("li");
          if (!li) return;
          draggingEl = li;
          draggingFrom = list.id;
          li.classList.add("dragging");
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", li.dataset.section);
        });
        list.addEventListener("dragend", () => {
          if (draggingEl) draggingEl.classList.remove("dragging");
          draggingEl = null;
          draggingFrom = null;
        });
        list.addEventListener("dragover", (e) => {
          e.preventDefault();
          if (!draggingEl) return;
          const after = getAfterElement(list, e.clientY);
          if (after == null) {
            list.appendChild(draggingEl);
          } else {
            list.insertBefore(draggingEl, after);
          }
        });
        list.addEventListener("drop", (e) => {
          e.preventDefault();
          const section = e.dataTransfer.getData("text/plain");
          if (!section) return;
          if (list.id === "section-list") {
            const exists = Array.from(list.children).some((child) => child !== draggingEl && child.dataset.section === section);
            if (exists) {
              document.getElementById("available-list").appendChild(draggingEl);
              draggingEl = null;
              return;
            }
          }
          const movedFromPage = draggingFrom === "section-list" && list.id !== "section-list";
          draggingEl = null;
          draggingFrom = null;
          if (list.id === "section-list" || movedFromPage) {
            persistPages(true).then(() => renderPages());
          }
        });
      });
    }

    const pageSelectEl = document.getElementById("page-select");
    if (pageSelectEl) {
      pageSelectEl.addEventListener("change", (e) => {
        currentPageIndex = parseInt(e.target.value, 10) || 0;
        renderPages();
      });
    }

    const saveTheaterBtn = document.getElementById("save_theater_btn");
    if (copyToKtoBtn) {
      copyToKtoBtn.addEventListener("click", () => {
        applyCopyToKtoMode(!copyToKtoEnabled);
      });
    }
    if (saveTheaterBtn) {
      saveTheaterBtn.addEventListener("click", async () => {
        const payload = {
          target_folder: document.getElementById("target_folder_field").value,
          map_file: document.getElementById("map_file_field").value,
          copy_to_kto: copyToKtoEnabled
        };
        try {
          await fetchJSON("/api/theater", { method: "POST", body: JSON.stringify(payload) });
          log("Theater settings saved");
          await loadTheater(true);
          await refreshCamSaveList(false);
        } catch (err) {
          log(`Save theater failed: ${err.message}`);
        }
      });
    }

    async function persistPages(autoGenerate = false) {
      const list = document.getElementById("section-list");
      if (!list) return;
      const newOrder = Array.from(list.children).map((li) => li.dataset.section);
      pages[currentPageIndex] = newOrder;
      const pagesObj = {};
      pages.forEach((p, idx) => {
        pagesObj[`page${idx + 1}`] = (p || []).join(", ");
      });
      if (autoGenerate) {
        const overrides = currentOverrides();
        overrides.pages = pagesObj;
        await doPreview(overrides);
        return;
      }
      try {
        await fetchJSON("/api/config", { method: "POST", body: JSON.stringify({ pages: pagesObj }) });
        log("Layout saved");
        await loadStatus();
      } catch (err) {
        log(`Save layout failed: ${err.message}`);
      }
    }

    const saveLayoutBtn = document.getElementById("save-layout-btn");
    if (saveLayoutBtn) {
      saveLayoutBtn.addEventListener("click", async () => {
        await persistPages(false);
        window.layoutDirty = false;
      });
    }

    if (autoExportModeBtn) {
      autoExportModeBtn.addEventListener("click", async () => {
        const prevOn = autoExportOnChange;
        const prevPdfOnly = autoExportPdfOnly;
        const nextMode = (getAutoExportModeIndex() + 1) % 3;
        const nextOn = nextMode !== 0;
        const nextPdfOnly = nextMode === 2;
        applyAutoExportMode(nextOn, nextPdfOnly);
        try {
          await fetchJSON("/api/config/runtime", {
            method: "POST",
            body: JSON.stringify({
              system: {
                auto_export_on_change: nextOn ? "True" : "False",
                auto_export_pdf_only: nextPdfOnly ? "True" : "False"
              }
            })
          });
          if (!nextOn) {
            log("Auto-export disabled");
          } else if (nextPdfOnly) {
            log("Auto-export enabled (PDF only)");
          } else {
            log("Auto-export enabled");
          }
        } catch (err) {
          applyAutoExportMode(prevOn, prevPdfOnly);
          log(`Failed to save auto-export setting: ${err.message}`);
        }
      });
    }

    loadConfig().then(() => {
      loadStatus();
      refreshBrief();
      pollLogs();
      pollStatusBadges();
      setInterval(pollLogs, 2500);
      setInterval(pollStatusBadges, 5000);
    });
  </script>
</body>
</html>
