<!DOCTYPE = html>
<head>
<title>HTML BRIEFING {%- if not brief_is_joined %}- PAGE {{num}}{% endif %}</title>
<link rel="shortcut icon" type="image/png" href="../assets/icon.png">
<style>
  body {
      width: 800px;
  }
table, th, td {
  border: 2px solid black;
  border-collapse: collapse;
  text-align: center;
  align-items: center; 
  vertical-align : middle;
  padding: 3px;
  background-color: eeeeee;
}
.editable {
  background-color: ffffff;
}
td {
    height: 1.7em;
}
.header {
    background-color: dddddd;
}
.refreshButton {
    font-weight: bold;
}
@media print {
    .page, .page-break { break-after: page; }
}
</style>
</head>
<body>

{% if brief_is_joined %}
{% for page in brief_pages %}
<div {% if loop.index != brief_pages|length %} class="page" {% endif %}>
  {% for part in page %}
   {% include (part+".html") %}
  {% endfor %}
<style>
</style>
<table width="100%">
    <thead>
      <tr>
	<th class="header"><button id="save" onclick="saveContenteditables()">Save changes</button> <button id="load" onclick="loadContenteditables()">Load changes</button>
	</th>
	<th class="header"><button id="reload" onclick="reloadFromFiles()">Reload briefing files</button></th>
	<th class="header"><button id="reset" onclick="resetContenteditables()">Reset changes</button></th>
	<th class="header" width="10%"> Page {{loop.index}}</th>
	</th>
        </tr>
    </thead>
</table>
</div>
<br>
{% endfor %}

{% else %}
{% for p in brief_pages[num - 1] %}
   {% include (p+".html") %}
{% endfor %}
<table width="100%">
    <thead>
      <tr>
	<th class="header"><button id="save" onclick="saveContenteditables()">Save changes</button> <button id="load" onclick="loadContenteditables()">Load changes</button>
	</th>
	<th class="header"><button id="reload" onclick="reloadFromFiles()">Reload briefing files</button></th>
	<th class="header"><button id="reset" onclick="resetContenteditables()">Reset changes</button></th>
	<th class="header" width="10%"> Page {{num}}</th>
	</th>
        </tr>
    </thead>
</table>
{% endif %}
<style>
</style>
</body>
<script>
  window.onload = function()
  {
      saveContenteditablesDefaults();

      var restore = localStorage.getItem("onrefresh");
      if (restore == "restore") {
       loadContenteditables();
  }
  if (restore == "reset") {
       saveContenteditables();
       document.getElementById('fileInput').value="";
       localStorage.setItem("mapFile", "map.png");
       localStorage.setItem("onrefresh", "restore");
  }
  }

    function saveContenteditables() {
	const contenteditableElements = document.querySelectorAll('[contenteditable="true"]');
	const contentData = {};
	contenteditableElements.forEach(el => {
            const key = el.id;
            contentData[key] = el.innerHTML;
	});
	contentData["mapZoom"] = map.getZoom();
	contentData["mapCenter"] = map.getCenter();
	contentData['bullseyePos'] = bullseye_overlay.getCenter();
	var selected_files = document.getElementById('fileInput').files;
	if (selected_files.length > 0) {
	    localStorage.setItem('mapFile', selected_files[0].name);
	}
	localStorage.setItem('contenteditables', JSON.stringify(contentData));
    }

    function saveContenteditablesDefaults() {
	const contenteditableElements = document.querySelectorAll('[contenteditable="true"]');
	const contentDataDef = {};
	contenteditableElements.forEach(el => {
            const key = el.id;
            contentDataDef[key] = el.innerHTML;
	});
	contentDataDef["mapZoom"] = map.getZoom();
	contentDataDef["mapCenter"] = map.getCenter();
	contentDataDef['bullseyePos'] = bullseye_overlay.getCenter();
	var selected_files = document.getElementById('fileInput').files;
	if (selected_files.length > 0) {
	    localStorage.setItem('mapFile', selected_files[0].name);
	}
	localStorage.setItem('contenteditablesDef', JSON.stringify(contentDataDef));
    }

    function restoreDefaultAtId(id) {
	const toRestore = document.querySelectorAll("." + id);
	const contentDataDef = JSON.parse(localStorage.getItem('contenteditablesDef') || '{}');
	for (i = 0; i < toRestore.length; i ++) {
	toRestore[i].innerHTML = contentDataDef[toRestore[i].id];
	}
    }


    function loadContenteditables() {
      const contentData = JSON.parse(localStorage.getItem('contenteditables') || '{}');
      Object.keys(contentData).forEach(key => {
        const el = document.getElementById(key);
        if (el) {
          el.innerHTML = contentData[key];
        }
      });
	drawMap("../assets/" + localStorage.getItem('mapFile'));
	try {
	    map.setView(contentData["mapCenter"], contentData["mapZoom"]);
	setBullseye(contentData['bullseyePos']);
	}
	catch (error) {
	    console.error(error);
	}

    }
  
    function reloadFromFiles() {
        saveContenteditables();
        localStorage.setItem("onrefresh", "restore");
	window.location.reload();
        return "false";
    }

    function resetContenteditables() {
    if (confirm("Are you sure? This will overwrite all changes.")){
        localStorage.setItem("onrefresh", "reset");
	window.location.reload();
        return "false";
  }
    }


</script>
