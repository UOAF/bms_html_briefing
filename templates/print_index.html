<!DOCTYPE html>
<head>
<meta charset="utf-8">
<title>HTML BRIEFING PDF</title>
<link rel="stylesheet" href="templates/style_print.css">
<link rel="stylesheet" href="templates/page_header.css">
<style>
  .page {
      width: 100%;
  }
  table {
      width: 100%;
      table-layout: fixed;
  }
  table, th, td {
      text-align: center;
      align-items: center;
      vertical-align: middle;
      padding: var(--brief-cell-padding, 3px);
  }
  .editable {
      background-color: #ffffff;
  }
  .briefing-flow-field {
      text-align: left;
      vertical-align: top;
  }
  td {
      height: var(--brief-row-height, 1.7em);
  }
  .header {
      background-color: #dddddd;
  }
  .nowrap {
      white-space: nowrap;
      word-break: normal;
  }
  .page, .page-break {
      break-after: page;
  }
</style>
</head>
<body data-dtc-scope="{{ dtc_fields.scope|e }}" data-popup-scope="{{ dtc_fields.popup_scope|default(dtc_fields.scope)|e }}">
{% for page in brief_pages %}
<div {% if loop.index != brief_pages|length %} class="page" {% endif %} id="page_{{loop.index}}"{% if brief_page_styles is defined %} style="{{ brief_page_styles[loop.index0] }}"{% endif %}>
  <div class="header brief-page-header" data-page-header><span data-page-label>Page {{loop.index}}</span></div>
  {% for part in page %}
    {% if part == "map" %}
      {% include "print_map.html" %}
    {% else %}
      {% include (part+".html") %}
    {% endif %}
  {% endfor %}
</div>
{% endfor %}
</body>
